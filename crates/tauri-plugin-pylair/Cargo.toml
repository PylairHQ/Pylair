[package]
name = "tauri-plugin-pylair"
version = "0.1.0-rc.11"
description = "Tauri plugin: Python runtime supervisor, IPC bridge, and permissions for Pylair apps"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PylairHQ/Pylair"
homepage = "https://github.com/PylairHQ/Pylair"
readme = "README.md"
keywords = ["tauri", "python", "pylair", "desktop"]
categories = ["development-tools", "gui", "os"]
edition.workspace = true
rust-version.workspace = true
links = "tauri-plugin-pylair"

[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
async-trait = "0.1"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tauri = { version = "2", features = ["test"] }
