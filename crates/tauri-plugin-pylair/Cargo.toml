[package]
name = "tauri-plugin-pylair"
version = "0.1.0-rc.25"
description = "Tauri plugin: Python runtime supervisor, IPC bridge, and permissions for Pylair apps"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PylairHQ/Pylair"
homepage = "https://github.com/PylairHQ/Pylair"
readme = "README.md"
keywords = ["tauri", "python", "pylair", "desktop"]
categories = ["development-tools", "gui", "os"]
edition.workspace = true
rust-version.workspace = true
links = "tauri-plugin-pylair"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
# Opt-in in-app updates (decision 0011): pulls tauri-plugin-updater for
# check/download/install plus ureq for the rollback-artifact fetch. Apps
# scaffolded without --with-updater never compile these dependencies.
updater = ["dep:tauri-plugin-updater", "dep:ureq", "dep:sha2", "dep:minisign-verify", "dep:base64"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
async-trait = "0.1"
dunce = "1"
# Save As dialog for wrap-mode downloads. gtk3 so Linux reuses the GTK that
# webkit2gtk already links, instead of needing an xdg-desktop-portal.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
# updater feature only (decision 0011).
tauri-plugin-updater = { version = "2", optional = true }
ureq = { version = "2", features = ["json"], optional = true }
sha2 = { version = "0.10", optional = true }
# Watchdog re-verifies the cached artifact before restore (§2) — the
# same verifier tauri-plugin-updater uses for forward updates.
minisign-verify = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tauri = { version = "2", features = ["test"] }
minisign = "0.10"
