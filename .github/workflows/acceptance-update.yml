name: acceptance-update

# End-to-end update acceptance (decision 0011, PR 4): a real
# create-pylair --with-updater app, five version variants built with
# pylair build --sign and served from a loopback manifest server, then
# installed/updated/rolled-back for real on each OS. Asserts the file
# contract (updater-state/*) + the app's own update surface
# (pylair.update.state(), on_update_confirmed, health().update) — never
# log greps alone.
#
# The only product-surface deviation CI makes is loopback http +
# dangerousInsecureTransportProtocol, patched into the scaffolded app's
# conf by scripts/update-acceptance/patch-conf.mjs — the templates keep
# their https placeholders (asserted before patching).

on:
  pull_request:
    paths:
      - "crates/tauri-plugin-pylair/src/update/**"
      - "packages/cli/src/update.ts"
      - "packages/cli/src/keys.ts"
      - "packages/cli/src/build.ts"
      - "packages/create-pylair/**"
      - "python/pylair/src/pylair/update.py"
      - "python/pylair/src/pylair/_readiness.py"
      - "packages/client/src/index.ts"
      - "packages/client/src/internal.ts"
      - "scripts/update-acceptance/**"
      - ".github/workflows/acceptance-update.yml"
  push:
    branches: [main]
    paths:
      - "crates/tauri-plugin-pylair/src/update/**"
      - "packages/cli/src/update.ts"
      - "packages/cli/src/keys.ts"
      - "packages/cli/src/build.ts"
      - "packages/create-pylair/**"
      - "python/pylair/src/pylair/update.py"
      - "python/pylair/src/pylair/_readiness.py"
      - "packages/client/src/index.ts"
      - "packages/client/src/internal.ts"
      - "scripts/update-acceptance/**"
      - ".github/workflows/acceptance-update.yml"
  workflow_dispatch:
    inputs:
      legs:
        description: "Leg(s) to run — PRs always run all three"
        type: choice
        default: all
        options: [all, ubuntu, windows, macos]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  APP_DIR: app-under-test
  APP_BIN: app-under-test
  IDENT: com.pylair.acceptupd
  PORT: "8791"
  # Throwaway signing key per run — generated by `pylair keys init` into
  # RUNNER_TEMP (outside the repo), the content lands in this env var
  # for tauri's artifact signer. Never committed, never printed.
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  ubuntu:
    name: ubuntu (AppImage, clean container)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.legs == 'all' || github.event.inputs.legs == 'ubuntu'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BUNDLES: appimage
      WORK: ${{ github.workspace }}/accept-work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build workspace packages
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: Scaffold updater app (local dep wiring)
        run: |
          node packages/create-pylair/dist/index.js app-under-test --with-updater --local . --identifier "$IDENT"
          echo "packages: []" > app-under-test/pnpm-workspace.yaml
      - name: Scaffold still carries https placeholders
        run: node scripts/update-acceptance/patch-conf.mjs --app "$APP_DIR" --check-placeholders
      - name: Install app deps
        working-directory: app-under-test
        run: |
          pnpm install --no-frozen-lockfile
          uv sync
      - name: Throwaway update signing key (never committed or logged)
        run: |
          cd "$APP_DIR" && pnpm exec pylair keys init --key-path "$RUNNER_TEMP/upd.key" --no-password
          # Multi-line key file: a single-line echo into GITHUB_ENV
          # truncates at the first newline. Heredoc form carries it all.
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<PYLAIR_KEY_EOF'
            cat "$RUNNER_TEMP/upd.key"
            echo # key files end without a newline -- the delimiter needs its own line
            echo 'PYLAIR_KEY_EOF'
          } >> "$GITHUB_ENV"
          echo "UPD_KEY_PATH=$RUNNER_TEMP/upd.key" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri
      - name: Build the five version variants
        run: |
          mkdir -p htdocs/{latest,releases,installable}
          S=scripts/update-acceptance/build-version.mjs
          node $S --app "$APP_DIR" --variant base   --version 1.0.0 --tag v1.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs
          node $S --app "$APP_DIR" --variant good   --version 2.0.0 --tag v2.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch
          node $S --app "$APP_DIR" --variant slow   --version 2.1.0 --tag v2.1.0 --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch
          node $S --app "$APP_DIR" --variant broken --version 3.0.0 --tag v3.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch
          node $S --app "$APP_DIR" --variant crash  --version 4.0.0 --tag v4.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch --crash
      - name: Run scenarios a–e in the clean ubuntu:22.04 container
        timeout-minutes: 20
        run: |
          mkdir -p "$WORK/home"
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          docker run --rm \
            -e SCRIPTS=/scripts \
            -v "$GITHUB_WORKSPACE/htdocs:/work/htdocs" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            -v "$WORK:/work" \
            ubuntu:22.04 bash /scripts/update-acceptance/linux-in-container.sh a b c d e
      - name: Upload acceptance evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6
        with:
          name: update-acceptance-ubuntu
          path: |
            ${{ env.WORK }}
            htdocs
          retention-days: 14

  windows:
    name: windows (NSIS currentUser + per-machine)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.legs == 'all' || github.event.inputs.legs == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUNDLES: nsis
      WORK: ${{ github.workspace }}/accept-work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build workspace packages
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: Scaffold updater app (local dep wiring)
        shell: bash
        run: |
          node packages/create-pylair/dist/index.js app-under-test --with-updater --local . --identifier "$IDENT"
          echo "packages: []" > app-under-test/pnpm-workspace.yaml
      - name: Scaffold still carries https placeholders
        shell: bash
        run: node scripts/update-acceptance/patch-conf.mjs --app "$APP_DIR" --check-placeholders
      - name: Install app deps
        working-directory: app-under-test
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile
          uv sync
      - name: Throwaway update signing key (never committed or logged)
        shell: bash
        run: |
          cd "$APP_DIR" && pnpm exec pylair keys init --key-path "$RUNNER_TEMP/upd.key" --no-password
          # Multi-line key file: a single-line echo into GITHUB_ENV
          # truncates at the first newline. Heredoc form carries it all.
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<PYLAIR_KEY_EOF'
            cat "$RUNNER_TEMP/upd.key"
            echo # key files end without a newline -- the delimiter needs its own line
            echo 'PYLAIR_KEY_EOF'
          } >> "$GITHUB_ENV"
          echo "UPD_KEY_PATH=$RUNNER_TEMP/upd.key" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri
      - name: Build the five version variants + two per-machine
        shell: bash
        run: |
          mkdir -p htdocs/{latest,releases,installable}
          S=scripts/update-acceptance/build-version.mjs
          node $S --app "$APP_DIR" --variant base   --version 1.0.0 --tag v1.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs
          node $S --app "$APP_DIR" --variant good   --version 2.0.0 --tag v2.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch
          node $S --app "$APP_DIR" --variant slow   --version 2.1.0 --tag v2.1.0 --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch
          node $S --app "$APP_DIR" --variant broken --version 3.0.0 --tag v3.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch
          node $S --app "$APP_DIR" --variant crash  --version 4.0.0 --tag v4.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch --crash
          node $S --app "$APP_DIR" --variant good   --version 8.0.0 --tag v8.0.0   --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch --install-mode perMachine
          node $S --app "$APP_DIR" --variant broken --version 9.0.0 --tag v9.0.0   --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch --install-mode perMachine
      - name: Run scenarios a–f
        timeout-minutes: 20
        shell: pwsh
        run: |
          pwsh -File scripts/update-acceptance/scenarios-windows.ps1 `
            -Work "$env:WORK" -Htdocs "$env:GITHUB_WORKSPACE/htdocs" `
            -Ident "$env:IDENT" -Port $env:PORT -AppBin "$env:APP_BIN" `
            -Scenarios a,b,c,d,e,f
      - name: Upload acceptance evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6
        with:
          name: update-acceptance-windows
          path: |
            ${{ env.WORK }}
            htdocs
          retention-days: 14

  # Capacity rule: ONE macOS job runs every scenario in sequence.
  macos:
    name: macos (.app, hardened runtime)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.legs == 'all' || github.event.inputs.legs == 'macos'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUNDLES: app
      WORK: ${{ github.workspace }}/accept-work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build workspace packages
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: Scaffold updater app (local dep wiring)
        run: |
          node packages/create-pylair/dist/index.js app-under-test --with-updater --local . --identifier "$IDENT"
          echo "packages: []" > app-under-test/pnpm-workspace.yaml
      - name: Scaffold still carries https placeholders
        run: node scripts/update-acceptance/patch-conf.mjs --app "$APP_DIR" --check-placeholders
      - name: Install app deps
        working-directory: app-under-test
        run: |
          pnpm install --no-frozen-lockfile
          uv sync
      - name: Throwaway update signing key (never committed or logged)
        run: |
          cd "$APP_DIR" && pnpm exec pylair keys init --key-path "$RUNNER_TEMP/upd.key" --no-password
          # Multi-line key file: a single-line echo into GITHUB_ENV
          # truncates at the first newline. Heredoc form carries it all.
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<PYLAIR_KEY_EOF'
            cat "$RUNNER_TEMP/upd.key"
            echo # key files end without a newline -- the delimiter needs its own line
            echo 'PYLAIR_KEY_EOF'
          } >> "$GITHUB_ENV"
          echo "UPD_KEY_PATH=$RUNNER_TEMP/upd.key" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri
      - name: Build the five version variants
        run: |
          mkdir -p htdocs/{latest,releases,installable}
          S=scripts/update-acceptance/build-version.mjs
          node $S --app "$APP_DIR" --variant base   --version 1.0.0 --tag v1.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs
          node $S --app "$APP_DIR" --variant good   --version 2.0.0 --tag v2.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch
          node $S --app "$APP_DIR" --variant slow   --version 2.1.0 --tag v2.1.0 --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch
          node $S --app "$APP_DIR" --variant broken --version 3.0.0 --tag v3.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch
          node $S --app "$APP_DIR" --variant crash  --version 4.0.0 --tag v4.0.0     --bundles "$BUNDLES" --port "$PORT" --out htdocs --skip-fetch --crash
      - name: Run scenarios a–e
        timeout-minutes: 20
        run: |
          mkdir -p "$WORK"
          WORK="$WORK" HTDOCS="$GITHUB_WORKSPACE/htdocs" IDENT="$IDENT" PORT="$PORT" \
            bash scripts/update-acceptance/scenarios-posix.sh a b c d e
      - name: Upload acceptance evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6
        with:
          name: update-acceptance-macos
          path: |
            ${{ env.WORK }}
            htdocs
          retention-days: 14
