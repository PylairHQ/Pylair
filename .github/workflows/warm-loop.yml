name: warm-loop (throwaway flake proof)

on:
  push:
    branches: [warm-deterministic]
  workflow_dispatch:

permissions:
  contents: read

# TEMPORARY — proof for the warm-worker determinism PR, dropped before
# the PR marks ready. Runs python/pylair/tests/test_warm.py 20 times
# back to back on the two OSes that flaked.
jobs:
  warm20:
    name: test_warm.py x20 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Sync pylair test env
        working-directory: python/pylair
        run: uv sync --frozen
      - name: test_warm.py, 20 iterations
        working-directory: python/pylair
        shell: bash
        run: |
          pass=0; fail=0
          for i in $(seq 1 20); do
            echo "=== iteration $i/20 ==="
            if out=$(uv run pytest tests/test_warm.py -q --tb=short -rf 2>&1); then
              echo "$out" | tail -3
              pass=$((pass + 1))
            else
              echo "$out" | tail -60
              fail=$((fail + 1))
            fi
          done
          echo "RESULT ${GITHUB_RUNNER_OS}: pass=$pass fail=$fail" | tee "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ]
