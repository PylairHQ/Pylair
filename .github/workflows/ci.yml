name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build-and-test only: every job checks out, builds and tests — nothing
# needs write access to contents, checks, or id-token.
permissions:
  contents: read

# Every uv invocation in this workflow resolves its interpreter under
# UV_PYTHON: the bundled runtime ships CPython 3.12.x, so CI must test
# what it ships — a fresh uv otherwise picks the newest stable release.
# This also reaches uv runs inside scaffolded apps (acceptance legs),
# which a repo .python-version file cannot.
env:
  UV_PYTHON: "3.12"

jobs:
  # Docs-only changes (docs/**, root *.md / LICENSE*, .github/*.md) skip the
  # heavy jobs. Markdown outside those places (package READMEs, template
  # files, the PyPI long description) ships and counts as code. The filter
  # is scripts/ci-changes.mjs (unit-tested here); anything it cannot prove is
  # docs-only counts as code. Jobs that are branch-protection checks (JS, Rust
  # and Python on ubuntu and windows) are gated STEP by step, so they still run,
  # report under their real names and pass: a job skipped by a job-level `if`
  # with a matrix reports under the unexpanded matrix name, and the required
  # check would wait forever. Jobs that are not required use a job-level `if`.
  changes:
    name: Changes
    runs-on: ubuntu-22.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Unit-test the change filter
        run: node --test scripts/ci-changes.test.mjs
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/ci-changes.mjs

  # Every third-party `uses:` must be a 40-hex commit sha, and the sha
  # must resolve to a commit — annotated-tag object shas pin nothing.
  action-pins:
    name: Action pins
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-action-pins.mjs --remote
      # actionlint, downloaded as a release tarball pinned by version and
      # sha256 (not a GitHub Action, so no uses: pin). -shellcheck= silences
      # shellcheck findings for now; expression and syntax errors still fail.
      - name: Lint workflow files (actionlint)
        env:
          AL_VERSION: "1.7.12"
          AL_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          echo "${AL_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -shellcheck= .github/workflows/*.yml

  js:
    name: JS (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs these suites in the single "macOS checks" job below.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          # cli codegen tests spawn `python -m pylair.codegen`;
          # pylair needs 3.12+ (PEP 695 syntax)
          python-version: "3.12"
      # `pylair build --stage-only` on a scaffolded wrap app (cli tests) locks
      # with uv and stages the bundled interpreter; it skips itself without uv.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.outputs.code == 'true'
        with:
          enable-cache: false
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      - run: pnpm build
        if: needs.changes.outputs.code == 'true'
      - run: pnpm typecheck
        if: needs.changes.outputs.code == 'true'
      - run: pnpm test
        if: needs.changes.outputs.code == 'true'

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: needs.changes.outputs.code == 'true'
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          # e2e tests spawn the real runtime; pylair needs 3.12+
          # (PEP 695 syntax). Matches the bundled-runtime version class.
          python-version: "3.12"
      - name: Linux Tauri dependencies
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --check
        if: needs.changes.outputs.code == 'true'
      - run: cargo clippy --all-targets -- -D warnings
        if: needs.changes.outputs.code == 'true'
      - run: cargo build
        if: needs.changes.outputs.code == 'true'
      - run: cargo test
        if: needs.changes.outputs.code == 'true'

  python:
    name: Python (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.outputs.code == 'true'
        with:
          enable-cache: true
      # bash everywhere: pwsh doesn't abort a step when a native command
      # mid-block exits non-zero — a failed `ruff format --check` was
      # masked by a later `pytest` pass (CI #91 Windows leg). bash runs -e.
      - working-directory: python/pylair
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          uv sync --frozen
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q
      - working-directory: integrations/ollama
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          uv sync --frozen
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q
      # W0 wrap spike: the launcher's kill_tree must reap a SIGTERM-ignoring
      # grandchild (process group on posix, taskkill /T on Windows).
      - working-directory: spikes/w0-wrap
        if: needs.changes.outputs.code == 'true'
        run: uv run --no-project python test_kill_tree.py

  # W3 wrap adapters: real Gradio and Streamlit apps through the launcher.
  # The frameworks live in the test-only `wrap` dependency group so the
  # python leg stays light; this leg is the only place they install.
  wrap-adapters:
    name: Wrap adapters (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - working-directory: python/pylair
        shell: bash
        run: |
          uv sync --frozen --group wrap
          uv run pytest tests/test_wrap_adapters.py -q

  # Early-warning leg: the same suite on the newest stable CPython.
  # `uv python install` pins nothing — it fetches the newest stable
  # managed build, which the ">=3.12" request then resolves to (managed
  # beats the runner's older system python). enable-cache is off so a
  # pinned-3.12 venv can't be reused and hide the signal.
  # continue-on-error means this job can never block a merge — it is NOT
  # a required check; failures surface only in its logs/annotations.
  # Not run on macOS: it is an early-warning signal, and the macOS runners
  # are the scarce ones.
  python-edge:
    name: Python edge (newest CPython, non-blocking, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      UV_PYTHON: ">=3.12"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv python install ">=3.12"
      # Explicit request: a bare `uv python find` resolves the repo-root
      # .python-version ("3.12") ahead of UV_PYTHON, which fails on runners
      # with no 3.12.x (ubuntu-22.04) and misreports on the rest.
      - run: uv python find ">=3.12"
      - working-directory: python/pylair
        shell: bash
        run: |
          uv sync --frozen
          uv run python -c "import sys; print(sys.version)"
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q

  # macOS: ONE job for the js, rust, python and wrap-adapters suites. macOS
  # runners are limited (about five at a time), and these four used to be four
  # jobs, each queueing for one. Every suite runs even when an earlier one fails
  # (`!cancelled()`: always, except when the run is cancelled), each is a step
  # named for its suite, and the job fails at the end if any failed, so one run
  # still reports every failing suite. Linux and Windows keep separate jobs.
  macos-checks:
    name: macOS checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: "JS suite: pnpm install, build, typecheck, test"
        id: js
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm test
      - name: "Rust suite: fmt, clippy, build, test"
        id: rust
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo build
          cargo test
      - name: "Python suite: pylair, ollama integration, w0 spike"
        id: python
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          (cd python/pylair && uv sync --frozen && uv run ruff check src tests && uv run ruff format --check src tests && uv run pytest -q)
          (cd integrations/ollama && uv sync --frozen && uv run ruff check src tests && uv run ruff format --check src tests && uv run pytest -q)
          (cd spikes/w0-wrap && uv run --no-project python test_kill_tree.py)
      - name: "Wrap adapters suite: gradio and streamlit through the launcher"
        id: adapters
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cd python/pylair
          uv sync --frozen --group wrap
          uv run pytest tests/test_wrap_adapters.py -q
      - name: Fail the job if any suite failed
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JS: ${{ steps.js.outcome }}
          RUST: ${{ steps.rust.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          ADAPTERS: ${{ steps.adapters.outcome }}
        run: |
          failed=""
          for s in JS RUST PYTHON ADAPTERS; do
            [ "${!s}" = "success" ] || failed="$failed $s(${!s})"
          done
          if [ -n "$failed" ]; then
            echo "::error::macOS suites that did not pass:$failed"
            exit 1
          fi
          echo "all four macOS suites passed"

  # The one-command story, proven: scaffold a fresh app, build a native
  # installer bundling Python, install/extract on a clean machine, and call
  # the app's Python through the bundled interpreter — no system Python.
  acceptance:
    name: acceptance (${{ matrix.os }}, ${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    env:
      APP_DIR: ${{ matrix.app == 'reference' && 'examples/reference-app' || 'app-under-test' }}
      APP_BIN: ${{ matrix.app == 'reference' && 'reference-app' || 'app-under-test' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: "appimage,deb"
            app: scaffold
          - os: windows-latest
            bundles: "nsis"
            app: scaffold
          - os: macos-latest
            bundles: "app,dmg"
            app: scaffold
          # The M6 exit test: the reference app installs and runs on clean
          # machines with no Python on all three OSes.
          - os: ubuntu-22.04
            bundles: "appimage,deb"
            app: reference
          - os: windows-latest
            bundles: "nsis"
            app: reference
          - os: macos-latest
            bundles: "app,dmg"
            app: reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build workspace packages (client + cli + scaffolder dists)
        # pwsh would mask a failed pnpm install if build passed anyway —
        # bash -e aborts on the first failing command.
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: Scaffold app (local dep wiring)
        if: matrix.app == 'scaffold'
        shell: bash
        run: |
          # --local . resolves to the checkout root on every OS; under
          # git-bash "$PWD" is an MSYS path (/d/a/...) that node's
          # path.resolve() misinterprets on Windows.
          node packages/create-pylair/dist/index.js app-under-test --local .
          # The app lives inside this repo's checkout; without its own
          # workspace root pnpm installs the monorepo instead of the app.
          echo "packages: []" > app-under-test/pnpm-workspace.yaml
      - name: Two-window self-test capability (scaffold legs)
        if: matrix.app == 'scaffold'
        shell: bash
        run: |
          # Deliberately NOT shipped in the template — it grants
          # emit/emitTo to a win-b label and references a permission that
          # exists only in the crate this branch builds (--local resolves
          # it). The reference app carries the canonical copy; CI injects
          # it here so the installed two-window self-test can run.
          cp examples/reference-app/src-tauri/capabilities/selftest-winb.json \
             app-under-test/src-tauri/capabilities/
          # The stderr-scoping check needs an exposed function that writes
          # to stderr; the template deliberately ships without one (a
          # test-only fixture must not ship), so CI appends the same
          # function the reference backend carries.
          cat >> app-under-test/backend/app.py <<'PYEOF'

          import sys


          @expose
          def log_stderr(msg: str) -> None:
              print(msg, file=sys.stderr)


          # This job builds the crate from this checkout, which enforces
          # per-function permissions: the self-test's fn-permission check
          # is mandatory here (the fixture's presence is what arms it).
          @expose
          def fn_permissions_fixture() -> None:
              return None


          # Per-window fairness self-test (decisions 0005): `hold`
          # occupies a task slot until cancelled; `holds_active` is the
          # rendezvous win-b polls before probing its own share. `b_ping`
          # is win-b's liveness mark (the call itself subscribes it), so
          # `b_seen` >= 1 proves win-b is live before the flood starts.
          _holds_active = 0
          _b_seen = 0


          @expose
          async def hold(seconds: float = 30.0) -> str:
              global _holds_active
              _holds_active += 1
              try:
                  await asyncio.sleep(seconds)
                  return "held"
              finally:
                  _holds_active -= 1


          @expose
          def holds_active() -> int:
              return _holds_active


          @expose
          def b_ping() -> int:
              global _b_seen
              _b_seen += 1
              return _b_seen


          @expose
          def b_seen() -> int:
              return _b_seen
          PYEOF
      # After scaffolding: restoring the cache earlier creates
      # src-tauri/target, and the scaffolder rightly refuses a
      # non-empty target directory.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri
      # A native wheel must load inside the packaged app: AppRun's
      # LD_LIBRARY_PATH used to leak AppDir libstdc++/libssl into Python.
      - name: Add a native-wheel dependency (numpy)
        if: matrix.app == 'scaffold'
        working-directory: app-under-test
        shell: bash
        run: |
          # If `uv add` failed, `printf` would still succeed and the
          # native-wheel coverage would be silently lost under pwsh.
          uv add numpy
          printf '\nimport numpy  # native wheel must load inside the bundle\n' >> backend/app.py
      - name: Install app deps
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile
          uv sync
      - name: pylair build (stages interpreter, env, prunes, tauri build)
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec pylair build --bundles ${{ matrix.bundles }}
      - name: Tripwire — release exe is a GUI binary (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "src-tauri/target/release/$env:APP_BIN.exe"
          if (-not (Test-Path $exe)) { Write-Error "release exe not found: $exe"; exit 1 }
          # PE optional-header Subsystem: 2 = WINDOWS_GUI, 3 = CONSOLE. A
          # console-subsystem release exe pops a terminal on every launch.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe).Path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $sub = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($sub -ne 2) { Write-Error "PE subsystem $sub — expected 2 (GUI)"; exit 1 }
          Write-Output "PE subsystem = $sub (GUI)"
      - name: Self-test installed app (Linux, clean container, no Python)
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          dpkg -x "$DEB" /tmp/approot
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          # Bare ubuntu:22.04 has NO python — the binary is a GUI binary so it
          # needs its linked system libs, but --self-test exits before the
          # Tauri loop/GTK init. It must spawn the bundled interpreter.
          docker run --rm -e APP_BIN="$APP_BIN" -v /tmp/approot:/r:ro ubuntu:22.04 bash -c '
            set -e; export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3; do apt-get update -qq && break || sleep 10; done
            apt-get install -y -qq libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 ca-certificates >/dev/null
            /r/usr/bin/$APP_BIN --self-test'
      - name: Self-test installed app (Linux GUI path, deb + AppImage)
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          dpkg -x "$DEB" /tmp/approot
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          cp "$APPIMAGE" /tmp/app.AppImage && chmod +x /tmp/app.AppImage
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          # The GUI variant runs the REAL app under xvfb and makes the call
          # through app.path().resource_dir() — the code path users hit.
          # Checked for both deb and AppImage layouts (they mount differently). The
          # AppImage is launched via AppRun, its real entry point: it sets the
          # library paths for the bundled WebKit (running the inner binary
          # directly fails to find WebKitNetworkProcess).
          docker run --rm -e APP_BIN="$APP_BIN" -v /tmp/approot:/r:ro -v /tmp/app.AppImage:/app.AppImage:ro ubuntu:22.04 bash -c '
            set -eo pipefail; export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3; do apt-get update -qq && break || sleep 10; done
            apt-get install -y -qq libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 ca-certificates xvfb libfuse2 >/dev/null
            echo "── deb layout (resource_dir path)"
            PYLAIR_SELF_TEST_GUI=1 xvfb-run -a /r/usr/bin/$APP_BIN
            echo "── appimage layout"
            cd /tmp && cp /app.AppImage . && chmod +x app.AppImage
            ./app.AppImage --appimage-extract >/dev/null
            PYLAIR_SELF_TEST_GUI=1 xvfb-run -a ./squashfs-root/AppRun
            # Webview self-test: the generated frontend drives the REAL
            # bridge (Tauri ACL, event routing): typed call, ordered stream,
            # cancellation. Exit code 0 only if all pass.
            echo "── webview self-test: deb"
            # PYLAIR_MAX_TASKS=4 keeps the window-fairness flood small
            # (the main window ceiling is 3 of 4 with two live windows).
            PYLAIR_SELF_TEST_WEBVIEW=1 PYLAIR_MAX_TASKS=4 timeout 120 xvfb-run -a /r/usr/bin/$APP_BIN | tee /tmp/wst-deb.log
            echo "── webview self-test: appimage"
            PYLAIR_SELF_TEST_WEBVIEW=1 PYLAIR_MAX_TASKS=4 timeout 120 xvfb-run -a ./squashfs-root/AppRun | tee /tmp/wst-appimage.log
            # --local legs always resolve a crate with stderr scoping and
            # the fixture is always appended above — a "skipped" verdict
            # here means the probe silently stopped running. Skips are
            # legitimate only on pack/registry legs (published crate).
            for f in /tmp/wst-deb.log /tmp/wst-appimage.log; do
              # No single quotes here — this whole block is inside the
              # single-quoted bash -c docker script.
              if grep -q "stderr-delivery.*skipped" "$f"; then
                echo "stderr-delivery skipped on a --local leg — probe must run here" >&2
                exit 1
              fi
              if grep -q "\"health\":\"skipped" "$f"; then
                echo "health skipped on a --local leg — probe must run here" >&2
                exit 1
              fi
            done
            # WindowDestroyed runs on the main thread — the rc.3 window-close
            # crash lived there; open+close under xvfb keeps it covered.
            echo "── window-close self-test"
            PYLAIR_SELF_TEST_WINDOW_CLOSE=1 timeout 90 xvfb-run -a /r/usr/bin/$APP_BIN'
      - name: Self-test installed app (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.APP_DIR }}
        run: |
          # pipefail: the webview self-test tees its log below — without
          # it a failing app exit is masked by tee's 0 (bug since ea00496).
          set -eo pipefail
          APP=$(find src-tauri/target/release/bundle/macos -name '*.app' | head -1)
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$APP/Contents/MacOS/$APP_BIN" --self-test
          env -i HOME="$HOME" PATH=/usr/bin:/bin PYLAIR_SELF_TEST_GUI=1 "$APP/Contents/MacOS/$APP_BIN"
          # Webview self-test through the real bridge, run from outside the checkout.
          cd /tmp && env -i HOME="$HOME" PATH=/usr/bin:/bin PYLAIR_SELF_TEST_WEBVIEW=1 PYLAIR_MAX_TASKS=4 "$GITHUB_WORKSPACE/$APP_DIR/$APP/Contents/MacOS/$APP_BIN" | tee /tmp/wst.log
          # --local always resolves a crate with stderr scoping — a
          # "skipped" verdict here means the probe silently stopped
          # running (legitimate only on pack/registry legs).
          if grep -q '"stderr-delivery":"skipped' /tmp/wst.log; then
            echo "stderr-delivery skipped on a --local leg — probe must run here" >&2
            exit 1
          fi
          if grep -q '"health":"skipped' /tmp/wst.log; then
            echo "health skipped on a --local leg — probe must run here" >&2
            exit 1
          fi
          # WindowDestroyed on the main thread — the rc.3 window-close panic.
          env -i HOME="$HOME" PATH=/usr/bin:/bin PYLAIR_SELF_TEST_WINDOW_CLOSE=1 "$GITHUB_WORKSPACE/$APP_DIR/$APP/Contents/MacOS/$APP_BIN"
      - name: Self-test installed app (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $i = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $i) { Write-Error 'nsis installer not found'; exit 1 }
          $inst = Start-Process -FilePath $i.FullName -ArgumentList '/S' -Wait -PassThru
          if ($inst.ExitCode -ne 0) { Write-Error "nsis install exit $($inst.ExitCode)"; exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" `
                -Recurse -Filter "$env:APP_BIN.exe" -Depth 3 -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $exe) { Write-Error "installed $env:APP_BIN.exe not found"; exit 1 }
          # GUI-subsystem exe: `&` returns immediately and $LASTEXITCODE is
          # stale — wait on the process handle and read the real ExitCode.
          $st = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -PassThru
          if (-not $st.WaitForExit(120000)) { $st.Kill(); Write-Error 'self-test timed out'; exit 1 }
          if ($st.ExitCode -ne 0) { Write-Error "self-test exit $($st.ExitCode)"; exit 1 }
          # Webview self-test through the real bridge (ACL, events, cancel).
          # stdout/stderr redirected so the verdict JSON lands in the log
          # and the stderr-delivery skip-check can read it (a GUI exe's
          # output otherwise never reaches the runner log).
          $env:PYLAIR_SELF_TEST_WEBVIEW = '1'
          $env:PYLAIR_MAX_TASKS = '4'
          $out = Join-Path $env:TEMP 'wst-out.txt'
          $err = Join-Path $env:TEMP 'wst-err.txt'
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $env:TEMP `
                -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error 'webview self-test timed out'; exit 1 }
          Get-Content $out,$err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "webview self-test exit $($p.ExitCode)"; exit 1 }
          # --local always resolves a crate with stderr scoping — a
          # "skipped" verdict here means the probe silently stopped
          # running (legitimate only on pack/registry legs).
          if (Select-String -Path $out -Pattern '"stderr-delivery":"skipped' -Quiet -ErrorAction SilentlyContinue) {
            Write-Error 'stderr-delivery skipped on a --local leg — probe must run here'
            exit 1
          }
          if (Select-String -Path $out -Pattern '"health":"skipped' -Quiet -ErrorAction SilentlyContinue) {
            Write-Error 'health skipped on a --local leg — probe must run here'
            exit 1
          }
          # WindowDestroyed on the main thread — the rc.3 window-close panic
          # was found by manual dogfood; cover it in CI on every leg.
          $env:PYLAIR_SELF_TEST_WEBVIEW = $null
          $env:PYLAIR_MAX_TASKS = $null
          $env:PYLAIR_SELF_TEST_WINDOW_CLOSE = '1'
          $wc = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $wc.WaitForExit(120000)) { $wc.Kill(); Write-Error 'window-close self-test timed out'; exit 1 }
          if ($wc.ExitCode -ne 0) { Write-Error "window-close self-test exit $($wc.ExitCode)"; exit 1 }
          $env:PYLAIR_SELF_TEST_WINDOW_CLOSE = $null

  # Wrap mode, the real thing (docs/wrap-mode-brief.md section 7): scaffold a
  # wrap app against THIS checkout (--local), build the installer, install it
  # where the bridge acceptance legs install theirs, and run the installed
  # wrap self-test on the real webview of each OS: WebView2 (Windows),
  # WKWebView (macOS), WebKitGTK under xvfb (Linux). For FastAPI (command),
  # Gradio and Streamlit. The self-test proves, per app: the supervisor
  # reached ready, the window shows the app url, GET returns the marker, the
  # navigation lock refuses what it must, the 10-call IPC probe from the
  # wrapped page is denied (the permanent no-IPC check), a restart is
  # followed to a new url, and a KILLED server is a crash that recovers to a
  # new url with the app serving again. This is the only proof of the Linux
  # and macOS webviews. The bridge acceptance job above is untouched.
  wrap-acceptance:
    name: wrap acceptance (${{ matrix.os }}, ${{ matrix.framework }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      APP_DIR: wrap-app
      APP_BIN: wrap-app
      # Gradio embeds the page title in the config `GET /` serves; FastAPI
      # serves the marker itself; Streamlit renders over a websocket, so its
      # static shell (title "Streamlit") is what a GET can see.
      MARKER: ${{ matrix.framework == 'streamlit' && 'Streamlit' || 'PYLAIR-WRAP-OK' }}
    strategy:
      fail-fast: false
      matrix:
        # macOS: see wrap-acceptance-macos below (one job, three frameworks).
        os: [ubuntu-22.04, windows-latest]
        framework: [command, gradio, streamlit]
        include:
          # One bundle per OS is enough to install and run the app: the
          # bridge legs also build appimage and dmg.
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # One uv cache per framework: gradio and streamlit wheels are the
          # slow part, and a FastAPI leg should not restore them.
          cache-suffix: wrap-${{ matrix.framework }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build workspace packages (client + cli + scaffolder dists)
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: Scaffold the wrap app (local dep wiring) and prepare the framework
        shell: bash
        run: |
          node packages/create-pylair/dist/index.js "$APP_DIR" --mode wrap --local .
          # The app lives inside this checkout; without its own workspace
          # root pnpm installs the monorepo instead of the app.
          echo "packages: []" > "$APP_DIR/pnpm-workspace.yaml"
          node scripts/wrap-acceptance/prepare.mjs "$APP_DIR" ${{ matrix.framework }}
      # After scaffolding: restoring the cache earlier creates
      # src-tauri/target, and the scaffolder rightly refuses a non-empty
      # target directory. The Rust side is the same for every framework, so
      # the three legs of one OS share a cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri
          shared-key: wrap-${{ runner.os }}
      - name: Install app deps
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile
          uv sync
      - name: pylair build (stages interpreter, env, prunes, framework import check, tauri build)
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec pylair build --bundles ${{ matrix.bundles }}
      - name: Installed wrap self-test (Linux, clean container, xvfb)
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          dpkg -x "$DEB" /tmp/approot
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          # Bare ubuntu:22.04: no Python, no framework, no GUI libs beyond
          # what the installed app needs. The REAL app runs under xvfb (the
          # same GUI variant the bridge legs use) and checks itself.
          docker run --rm -e APP_BIN -e MARKER -v /tmp/approot:/r:ro ubuntu:22.04 bash -c '
            set -eo pipefail; export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3; do apt-get update -qq && break || sleep 10; done
            apt-get install -y -qq libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 ca-certificates xvfb >/dev/null
            touch /tmp/wrap-restart-trigger
            export PYLAIR_SELF_TEST_WRAP="$MARKER" PYLAIR_SELF_TEST_WRAP_RESTART=1 PYLAIR_SELF_TEST_WRAP_CRASH=1 PYLAIR_RESTART_TRIGGER=/tmp/wrap-restart-trigger
            timeout 600 xvfb-run -a /r/usr/bin/$APP_BIN 2>&1 | tee /tmp/wrap-self-test.log
            grep -q "wrap-self-test: ok" /tmp/wrap-self-test.log'
      - name: Installed wrap self-test (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $i = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $i) { Write-Error 'nsis installer not found'; exit 1 }
          $inst = Start-Process -FilePath $i.FullName -ArgumentList '/S' -Wait -PassThru
          if ($inst.ExitCode -ne 0) { Write-Error "nsis install exit $($inst.ExitCode)"; exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" `
                -Recurse -Filter "$env:APP_BIN.exe" -Depth 3 -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $exe) { Write-Error "installed $env:APP_BIN.exe not found"; exit 1 }
          $trigger = Join-Path $env:TEMP 'wrap-restart-trigger'
          Set-Content -Path $trigger -Value 'x'
          $env:PYLAIR_SELF_TEST_WRAP = $env:MARKER
          $env:PYLAIR_SELF_TEST_WRAP_RESTART = '1'
          $env:PYLAIR_SELF_TEST_WRAP_CRASH = '1'
          $env:PYLAIR_RESTART_TRIGGER = $trigger
          # A GUI-subsystem exe: redirect so the verdict lands in the log, and
          # wait on the process handle for the real exit code.
          $out = Join-Path $env:TEMP 'wrap-st-out.txt'
          $err = Join-Path $env:TEMP 'wrap-st-err.txt'
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $env:TEMP `
                -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $done = $p.WaitForExit(600000)
          Get-Content $out,$err -ErrorAction SilentlyContinue
          if (-not $done) { $p.Kill(); Write-Error 'wrap self-test timed out'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "wrap self-test exit $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path $out -Pattern 'wrap-self-test: ok' -Quiet)) {
            Write-Error 'no "wrap-self-test: ok" verdict in the output'; exit 1
          }

  # macOS: ONE job builds, installs and self-tests command, gradio and
  # streamlit in sequence (scripts/wrap-acceptance/run-macos.sh), because macOS
  # runners are the scarce ones and this used to be three jobs. Each framework
  # is its own step and runs even when an earlier one failed. The three builds
  # share one Rust target dir, so tauri compiles once. This is the only proof
  # of the WKWebView.
  wrap-acceptance-macos:
    name: wrap acceptance (macos-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/wrap-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-suffix: wrap-macos
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build workspace packages (client + cli + scaffolder dists)
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      # rust-cache wants a Cargo workspace to key on: scaffold one app now
      # (run-macos.sh scaffolds each framework afresh; the shared target dir
      # lives outside it).
      - name: Scaffold an app for the Rust cache key
        shell: bash
        run: node packages/create-pylair/dist/index.js wrap-app --mode wrap --local .
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wrap-app/src-tauri
          shared-key: wrap-macOS
      - name: "wrap acceptance: command (FastAPI)"
        id: command
        shell: bash
        run: bash scripts/wrap-acceptance/run-macos.sh command
      - name: "wrap acceptance: gradio"
        id: gradio
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/wrap-acceptance/run-macos.sh gradio
      - name: "wrap acceptance: streamlit"
        id: streamlit
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/wrap-acceptance/run-macos.sh streamlit
      - name: Fail the job if any framework failed
        if: ${{ !cancelled() }}
        shell: bash
        env:
          COMMAND: ${{ steps.command.outcome }}
          GRADIO: ${{ steps.gradio.outcome }}
          STREAMLIT: ${{ steps.streamlit.outcome }}
        run: |
          failed=""
          for f in COMMAND GRADIO STREAMLIT; do
            [ "${!f}" = "success" ] || failed="$failed $f(${!f})"
          done
          if [ -n "$failed" ]; then
            echo "::error::macOS wrap frameworks that did not pass:$failed"
            exit 1
          fi
          echo "command, gradio and streamlit all passed on macOS"
