name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build-and-test only: every job checks out, builds and tests — nothing
# needs write access to contents, checks, or id-token.
permissions:
  contents: read

# Every uv invocation in this workflow resolves its interpreter under
# UV_PYTHON: the bundled runtime ships CPython 3.12.x, so CI must test
# what it ships — a fresh uv otherwise picks the newest stable release.
# This also reaches uv runs inside scaffolded apps (acceptance legs),
# which a repo .python-version file cannot.
env:
  UV_PYTHON: "3.12"

jobs:
  # Every third-party `uses:` must be a 40-hex commit sha, and the sha
  # must resolve to a commit — annotated-tag object shas pin nothing.
  action-pins:
    name: Action pins
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-action-pins.mjs --remote

  js:
    name: JS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # cli codegen tests spawn `python -m pylair.codegen`;
          # pylair needs 3.12+ (PEP 695 syntax)
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # e2e tests spawn the real runtime; pylair needs 3.12+
          # (PEP 695 syntax). Matches the bundled-runtime version class.
          python-version: "3.12"
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: cargo test

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # bash everywhere: pwsh doesn't abort a step when a native command
      # mid-block exits non-zero — a failed `ruff format --check` was
      # masked by a later `pytest` pass (CI #91 Windows leg). bash runs -e.
      - working-directory: python/pylair
        shell: bash
        run: |
          uv sync --frozen
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q
      - working-directory: integrations/ollama
        shell: bash
        run: |
          uv sync --frozen
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q
      # W0 wrap spike: the launcher's kill_tree must reap a SIGTERM-ignoring
      # grandchild (process group on posix, taskkill /T on Windows).
      - working-directory: spikes/w0-wrap
        run: uv run --no-project python test_kill_tree.py

  # Early-warning leg: the same suite on the newest stable CPython.
  # `uv python install` pins nothing — it fetches the newest stable
  # managed build, which the ">=3.12" request then resolves to (managed
  # beats the runner's older system python). enable-cache is off so a
  # pinned-3.12 venv can't be reused and hide the signal.
  # continue-on-error means this job can never block a merge — it is NOT
  # a required check; failures surface only in its logs/annotations.
  python-edge:
    name: Python edge (newest CPython, non-blocking, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      UV_PYTHON: ">=3.12"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv python install ">=3.12"
      # Explicit request: a bare `uv python find` resolves the repo-root
      # .python-version ("3.12") ahead of UV_PYTHON, which fails on runners
      # with no 3.12.x (ubuntu-22.04) and misreports on the rest.
      - run: uv python find ">=3.12"
      - working-directory: python/pylair
        shell: bash
        run: |
          uv sync --frozen
          uv run python -c "import sys; print(sys.version)"
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q

  # M0 feasibility spike: build installers bundling python-build-standalone
  # + a uv-locked env on all three OSes, then prove the bundled payload runs
  # with no system Python. See spikes/m0-packaging/README.md.
  m0-spike:
    name: M0 installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: "appimage,deb"
          - os: windows-latest
            bundles: "nsis"
          - os: macos-latest
            bundles: "app,dmg"
    defaults:
      run:
        working-directory: spikes/m0-packaging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: spikes/m0-packaging/src-tauri
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Stage bundled resources (interpreter + locked env)
        run: pnpm stage
      - name: Verify staged payload before bundling
        if: runner.os != 'Windows'
        run: ./scripts/verify-bundled.sh src-tauri/resources
      - name: Verify staged payload before bundling (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-bundled.ps1 -Root src-tauri/resources
      - name: Build installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m0-${{ matrix.os }}
          path: spikes/m0-packaging/src-tauri/target/release/bundle/**
          if-no-files-found: error
      - name: Clean-machine check (bare ubuntu:22.04 container, no Python)
        if: runner.os == 'Linux'
        run: |
          # Extract the deb payload: no FUSE, no execution, deterministic —
          # unlike running --appimage-extract on a shared runner.
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          echo "installer: $DEB"
          dpkg -x "$DEB" /tmp/debroot
          RESROOT=/tmp/debroot/usr/lib/m0-packaging-spike
          ls "$RESROOT"
          # Bare ubuntu:22.04 has no Python and none of the app's GUI libs —
          # if the payload runs here, it runs on a clean machine.
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          docker run --rm \
            -v "$RESROOT:/bundle:ro" \
            -v "$PWD/scripts/verify-bundled.sh:/verify.sh:ro" \
            ubuntu:22.04 bash /verify.sh /bundle
      - name: Clean-machine check (installed .app payload)
        if: runner.os == 'macOS'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -name '*.app' | head -1)
          ./scripts/verify-bundled.sh "$APP/Contents/Resources"
      - name: Clean-machine check (silent NSIS install + payload)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { Write-Error 'nsis installer not found'; exit 1 }
          # Start-Process does not propagate the installer's exit code — a
          # failed /S install would be silently masked. Check it explicitly.
          $inst = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($inst.ExitCode -ne 0) { Write-Error "nsis install exit $($inst.ExitCode)"; exit 1 }
          # Locate the bundled interpreter wherever NSIS put the install dir.
          $py = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
                -Recurse -Filter 'python.exe' -Depth 4 -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -like '*m0-packaging-spike*' } | Select-Object -First 1
          if (-not $py) { Write-Error 'installed bundled python.exe not found'; exit 1 }
          Write-Output "bundled interpreter: $($py.FullName)"
          $resroot = Split-Path (Split-Path $py.FullName -Parent) -Parent
          ./scripts/verify-bundled.ps1 -Root $resroot

  # The one-command story, proven: scaffold a fresh app, build a native
  # installer bundling Python, install/extract on a clean machine, and call
  # the app's Python through the bundled interpreter — no system Python.
  acceptance:
    name: acceptance (${{ matrix.os }}, ${{ matrix.app }})
    runs-on: ${{ matrix.os }}
    env:
      APP_DIR: ${{ matrix.app == 'reference' && 'examples/reference-app' || 'app-under-test' }}
      APP_BIN: ${{ matrix.app == 'reference' && 'reference-app' || 'app-under-test' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: "appimage,deb"
            app: scaffold
          - os: windows-latest
            bundles: "nsis"
            app: scaffold
          - os: macos-latest
            bundles: "app,dmg"
            app: scaffold
          # The M6 exit test: the reference app installs and runs on clean
          # machines with no Python on all three OSes.
          - os: ubuntu-22.04
            bundles: "appimage,deb"
            app: reference
          - os: windows-latest
            bundles: "nsis"
            app: reference
          - os: macos-latest
            bundles: "app,dmg"
            app: reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build workspace packages (client + cli + scaffolder dists)
        # pwsh would mask a failed pnpm install if build passed anyway —
        # bash -e aborts on the first failing command.
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: Scaffold app (local dep wiring)
        if: matrix.app == 'scaffold'
        shell: bash
        run: |
          # --local . resolves to the checkout root on every OS; under
          # git-bash "$PWD" is an MSYS path (/d/a/...) that node's
          # path.resolve() misinterprets on Windows.
          node packages/create-pylair/dist/index.js app-under-test --local .
          # The app lives inside this repo's checkout; without its own
          # workspace root pnpm installs the monorepo instead of the app.
          echo "packages: []" > app-under-test/pnpm-workspace.yaml
      - name: Two-window self-test capability (scaffold legs)
        if: matrix.app == 'scaffold'
        shell: bash
        run: |
          # Deliberately NOT shipped in the template — it grants
          # emit/emitTo to a win-b label and references a permission that
          # exists only in the crate this branch builds (--local resolves
          # it). The reference app carries the canonical copy; CI injects
          # it here so the installed two-window self-test can run.
          cp examples/reference-app/src-tauri/capabilities/selftest-winb.json \
             app-under-test/src-tauri/capabilities/
          # The stderr-scoping check needs an exposed function that writes
          # to stderr; the template deliberately ships without one (a
          # test-only fixture must not ship), so CI appends the same
          # function the reference backend carries.
          cat >> app-under-test/backend/app.py <<'PYEOF'

          import sys


          @expose
          def log_stderr(msg: str) -> None:
              print(msg, file=sys.stderr)
          PYEOF
      # After scaffolding: restoring the cache earlier creates
      # src-tauri/target, and the scaffolder rightly refuses a
      # non-empty target directory.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri
      # A native wheel must load inside the packaged app: AppRun's
      # LD_LIBRARY_PATH used to leak AppDir libstdc++/libssl into Python.
      - name: Add a native-wheel dependency (numpy)
        if: matrix.app == 'scaffold'
        working-directory: app-under-test
        shell: bash
        run: |
          # If `uv add` failed, `printf` would still succeed and the
          # native-wheel coverage would be silently lost under pwsh.
          uv add numpy
          printf '\nimport numpy  # native wheel must load inside the bundle\n' >> backend/app.py
      - name: Install app deps
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile
          uv sync
      - name: pylair build (stages interpreter, env, prunes, tauri build)
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec pylair build --bundles ${{ matrix.bundles }}
      - name: Tripwire — release exe is a GUI binary (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "src-tauri/target/release/$env:APP_BIN.exe"
          if (-not (Test-Path $exe)) { Write-Error "release exe not found: $exe"; exit 1 }
          # PE optional-header Subsystem: 2 = WINDOWS_GUI, 3 = CONSOLE. A
          # console-subsystem release exe pops a terminal on every launch.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe).Path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $sub = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($sub -ne 2) { Write-Error "PE subsystem $sub — expected 2 (GUI)"; exit 1 }
          Write-Output "PE subsystem = $sub (GUI)"
      - name: Self-test installed app (Linux, clean container, no Python)
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          dpkg -x "$DEB" /tmp/approot
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          # Bare ubuntu:22.04 has NO python — the binary is a GUI binary so it
          # needs its linked system libs, but --self-test exits before the
          # Tauri loop/GTK init. It must spawn the bundled interpreter.
          docker run --rm -e APP_BIN="$APP_BIN" -v /tmp/approot:/r:ro ubuntu:22.04 bash -c '
            set -e; export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3; do apt-get update -qq && break || sleep 10; done
            apt-get install -y -qq libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 ca-certificates >/dev/null
            /r/usr/bin/$APP_BIN --self-test'
      - name: Self-test installed app (Linux GUI path, deb + AppImage)
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          dpkg -x "$DEB" /tmp/approot
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          cp "$APPIMAGE" /tmp/app.AppImage && chmod +x /tmp/app.AppImage
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          # The GUI variant runs the REAL app under xvfb and makes the call
          # through app.path().resource_dir() — the code path users hit.
          # Checked for both deb and AppImage layouts (they mount differently). The
          # AppImage is launched via AppRun, its real entry point: it sets the
          # library paths for the bundled WebKit (running the inner binary
          # directly fails to find WebKitNetworkProcess).
          docker run --rm -e APP_BIN="$APP_BIN" -v /tmp/approot:/r:ro -v /tmp/app.AppImage:/app.AppImage:ro ubuntu:22.04 bash -c '
            set -eo pipefail; export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3; do apt-get update -qq && break || sleep 10; done
            apt-get install -y -qq libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 ca-certificates xvfb libfuse2 >/dev/null
            echo "── deb layout (resource_dir path)"
            PYLAIR_SELF_TEST_GUI=1 xvfb-run -a /r/usr/bin/$APP_BIN
            echo "── appimage layout"
            cd /tmp && cp /app.AppImage . && chmod +x app.AppImage
            ./app.AppImage --appimage-extract >/dev/null
            PYLAIR_SELF_TEST_GUI=1 xvfb-run -a ./squashfs-root/AppRun
            # Webview self-test: the generated frontend drives the REAL
            # bridge (Tauri ACL, event routing): typed call, ordered stream,
            # cancellation. Exit code 0 only if all pass.
            echo "── webview self-test: deb"
            PYLAIR_SELF_TEST_WEBVIEW=1 timeout 120 xvfb-run -a /r/usr/bin/$APP_BIN | tee /tmp/wst-deb.log
            echo "── webview self-test: appimage"
            PYLAIR_SELF_TEST_WEBVIEW=1 timeout 120 xvfb-run -a ./squashfs-root/AppRun | tee /tmp/wst-appimage.log
            # --local legs always resolve a crate with stderr scoping and
            # the fixture is always appended above — a "skipped" verdict
            # here means the probe silently stopped running. Skips are
            # legitimate only on pack/registry legs (published crate).
            for f in /tmp/wst-deb.log /tmp/wst-appimage.log; do
              # No single quotes here — this whole block is inside the
              # single-quoted bash -c docker script.
              if grep -q "stderr-delivery.*skipped" "$f"; then
                echo "stderr-delivery skipped on a --local leg — probe must run here" >&2
                exit 1
              fi
            done
            # WindowDestroyed runs on the main thread — the rc.3 window-close
            # crash lived there; open+close under xvfb keeps it covered.
            echo "── window-close self-test"
            PYLAIR_SELF_TEST_WINDOW_CLOSE=1 timeout 90 xvfb-run -a /r/usr/bin/$APP_BIN'
      - name: Self-test installed app (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.APP_DIR }}
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -name '*.app' | head -1)
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$APP/Contents/MacOS/$APP_BIN" --self-test
          env -i HOME="$HOME" PATH=/usr/bin:/bin PYLAIR_SELF_TEST_GUI=1 "$APP/Contents/MacOS/$APP_BIN"
          # Webview self-test through the real bridge, run from outside the checkout.
          cd /tmp && env -i HOME="$HOME" PATH=/usr/bin:/bin PYLAIR_SELF_TEST_WEBVIEW=1 "$GITHUB_WORKSPACE/$APP_DIR/$APP/Contents/MacOS/$APP_BIN" | tee /tmp/wst.log
          # --local always resolves a crate with stderr scoping — a
          # "skipped" verdict here means the probe silently stopped
          # running (legitimate only on pack/registry legs).
          if grep -q '"stderr-delivery":"skipped' /tmp/wst.log; then
            echo "stderr-delivery skipped on a --local leg — probe must run here" >&2
            exit 1
          fi
          # WindowDestroyed on the main thread — the rc.3 window-close panic.
          env -i HOME="$HOME" PATH=/usr/bin:/bin PYLAIR_SELF_TEST_WINDOW_CLOSE=1 "$GITHUB_WORKSPACE/$APP_DIR/$APP/Contents/MacOS/$APP_BIN"
      - name: Self-test installed app (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $i = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $i) { Write-Error 'nsis installer not found'; exit 1 }
          $inst = Start-Process -FilePath $i.FullName -ArgumentList '/S' -Wait -PassThru
          if ($inst.ExitCode -ne 0) { Write-Error "nsis install exit $($inst.ExitCode)"; exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" `
                -Recurse -Filter "$env:APP_BIN.exe" -Depth 3 -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $exe) { Write-Error "installed $env:APP_BIN.exe not found"; exit 1 }
          # GUI-subsystem exe: `&` returns immediately and $LASTEXITCODE is
          # stale — wait on the process handle and read the real ExitCode.
          $st = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -PassThru
          if (-not $st.WaitForExit(120000)) { $st.Kill(); Write-Error 'self-test timed out'; exit 1 }
          if ($st.ExitCode -ne 0) { Write-Error "self-test exit $($st.ExitCode)"; exit 1 }
          # Webview self-test through the real bridge (ACL, events, cancel).
          # stdout/stderr redirected so the verdict JSON lands in the log
          # and the stderr-delivery skip-check can read it (a GUI exe's
          # output otherwise never reaches the runner log).
          $env:PYLAIR_SELF_TEST_WEBVIEW = '1'
          $out = Join-Path $env:TEMP 'wst-out.txt'
          $err = Join-Path $env:TEMP 'wst-err.txt'
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $env:TEMP `
                -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error 'webview self-test timed out'; exit 1 }
          Get-Content $out,$err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "webview self-test exit $($p.ExitCode)"; exit 1 }
          # --local always resolves a crate with stderr scoping — a
          # "skipped" verdict here means the probe silently stopped
          # running (legitimate only on pack/registry legs).
          if (Select-String -Path $out -Pattern '"stderr-delivery":"skipped' -Quiet -ErrorAction SilentlyContinue) {
            Write-Error 'stderr-delivery skipped on a --local leg — probe must run here'
            exit 1
          }
          # WindowDestroyed on the main thread — the rc.3 window-close panic
          # was found by manual dogfood; cover it in CI on every leg.
          $env:PYLAIR_SELF_TEST_WEBVIEW = $null
          $env:PYLAIR_SELF_TEST_WINDOW_CLOSE = '1'
          $wc = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $wc.WaitForExit(120000)) { $wc.Kill(); Write-Error 'window-close self-test timed out'; exit 1 }
          if ($wc.ExitCode -ne 0) { Write-Error "window-close self-test exit $($wc.ExitCode)"; exit 1 }
          $env:PYLAIR_SELF_TEST_WINDOW_CLOSE = $null
