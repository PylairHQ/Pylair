name: Dependency audits

# Weekly + on-demand dependency audits across all three ecosystems.
# Read-only and never a PR gate — findings surface as job failures in
# this workflow only, so they can't block merges.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC — off the hour
  workflow_dispatch:

permissions:
  contents: read

# uvx/pip-audit and uv export spawn an interpreter too — pin it to the
# bundled-runtime family rather than whatever uv considers newest.
env:
  UV_PYTHON: "3.12"

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      # Direct cargo-audit — replaced rustsec/audit-check, which needs a
      # token to post check runs; this job stays contents: read. Pinned
      # with --locked (0.23.0 skipped: only days old at pin time).
      # Warnings (unmaintained/unsound — e.g. glib RUSTSEC-2024-0429,
      # proc-macro-error RUSTSEC-2024-0370) exit 0 by default; only real
      # vulnerabilities fail the job. Tighten with `--deny warnings`.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # Workspace lock — includes target-gated deps (the glib/gtk
      # chain) regardless of the runner's OS.
      - name: Audit workspace Cargo.lock
        run: cargo audit --file Cargo.lock
      # The template lock ships verbatim inside the create-pylair npm
      # tarball — every scaffolded app resolves against it.
      - name: Audit template Cargo.lock (ships in create-pylair)
        run: cargo audit --file packages/create-pylair/templates/default/src-tauri/Cargo.lock

  pnpm-audit:
    name: pnpm audit (prod deps only)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod

  pip-audit:
    name: pip-audit (pylair + pylair-ollama, prod deps)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Export production dependency sets
        run: |
          uv export --project python/pylair --no-dev --no-hashes --no-emit-project -o /tmp/pylair-prod.txt
          uv export --project integrations/ollama --no-dev --no-hashes --no-emit-project -o /tmp/ollama-prod.txt
      - name: Audit
        run: uvx pip-audit -r /tmp/pylair-prod.txt -r /tmp/ollama-prod.txt
