name: Publish crates

# Manual dispatch only: publishing is a deliberate act. Auth is OIDC
# trusted publishing — the job's id-token is exchanged for a short-lived
# crates.io token; no long-lived secret is used. Requires a Trusted
# Publisher configured on crates.io for this crate: repo PylairHQ/Pylair,
# workflow publish-crates.yml, environment `crates` (the environment MUST
# be listed because this job declares one).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Crate version to publish (e.g. 0.1.0 or 0.1.0-rc.1)"
        required: true
      dry_run:
        description: "Package + verify only, do not upload"
        type: boolean
        default: true

jobs:
  publish:
    # macOS: the dry-run verify step COMPILES the packaged crate — on Linux
    # that needs GTK/webkit system packages; on macOS it works with system
    # frameworks alone. The uploaded tarball is identical either way, and
    # ci.yml already compiles the crate on all three OSes.
    runs-on: macos-latest
    environment: crates
    permissions:
      contents: write # tag after a successful upload — never commits to main
      id-token: write # OIDC token for crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same pin as every other workflow — a drifting stable could
      # compile the published crate with a different rustc than CI.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"

      # Inputs reach the shell via env only — never ${{ inputs.* }}
      # inside run: (script-injection surface). Validate shape once,
      # before any use.
      - name: Validate the version input
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          # Whole-string bash regex — grep -x-style anchoring — plus an
          # explicit newline/CR rejection (=~ $ can sit before a trailing
          # newline under REG_NEWLINE).
          if [[ "$VERSION" == *$'\n'* || "$VERSION" == *$'\r'* ]] || \
             [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid version input: '$VERSION' — expected N.N.N[-suffix]"
            exit 1
          fi

      - name: Check version matches Cargo.toml
        # The version lives in the repo, bumped by a normal commit — the
        # job only verifies it, never pushes to main.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          repo_ver=$(grep '^version = ' crates/tauri-plugin-pylair/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [ "$repo_ver" = "$VERSION" ] || {
            echo "input '$VERSION' != Cargo.toml '$repo_ver' — bump the version in a normal commit first"
            exit 1
          }

      - name: Package + verify (always, even for real publishes)
        run: cargo publish -p tauri-plugin-pylair --dry-run

      # Trusted publishing: swap the GitHub OIDC JWT for a short-lived
      # crates.io token. Runs on dry_run too so the exchange can be tested
      # without publishing. There is no secret fallback: if the exchange
      # fails, the publish fails.
      - name: Exchange OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        run: cargo publish -p tauri-plugin-pylair
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Tag only runs if the upload above succeeded — a failed publish
      # leaves nothing behind.
      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "tauri-plugin-pylair-v$VERSION" -m "tauri-plugin-pylair $VERSION"
          git push origin "tauri-plugin-pylair-v$VERSION"
