# THROWAWAY — U0 updater spike evidence runs. workflow_dispatch only;
# this file is removed before the spike PR merges (run links stay in
# docs/decisions/0011-auto-update.md).
name: u0-updater

on:
  workflow_dispatch:
  push:
    branches: [u0-updater]

jobs:
  u0-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: tauri system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: spike proof
        shell: bash
        run: bash spikes/u0-updater/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u0-state-ubuntu
          path: spikes/u0-updater/out/state/

  u0-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: spike proof
        shell: bash
        run: bash spikes/u0-updater/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u0-state-windows
          path: spikes/u0-updater/out/state/

  u0-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: spike proof
        shell: bash
        run: bash spikes/u0-updater/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u0-state-macos
          path: spikes/u0-updater/out/state/
