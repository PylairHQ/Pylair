name: Registry acceptance
# Tooling sets dispatch_id to correlate this dispatch with the run it
# produced; the bracketed suffix only renders when the id is present.
run-name: "Registry acceptance${{ inputs.dispatch_id && format(' [{0}]', inputs.dispatch_id) || '' }}"

# Scaffolds an app from the SHIPPED artifacts and proves the whole path:
# npm install → uv sync → pylair build → --self-test (real bridge call
# through the bundled interpreter, no display needed).
#
# Two modes:
#   source=pack     (default): npm-pack the three packages, scaffold from
#                    the packed create-pylair tarball, and install the app
#                    deps from the packed tarballs — catches what WOULD
#                    ship (missing files, bad names) before it can't be
#                    changed. Run after bumping versions, before publish.
#   source=registry: scaffold via `npx create-pylair@next` — post-publish
#                    verification of what users actually get.
#
# Both jobs run in each mode: `acceptance` scaffolds a bridge app and
# `wrap-acceptance` scaffolds a `--mode wrap` app per framework
# (command, gradio, streamlit), mirroring ci.yml's wrap-acceptance.
#
# Registry-mode prerequisite: the pylair PyPI package and
# tauri-plugin-pylair crate versions pinned by the scaffolder must
# already be published — publish the crate first, then npm.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Install deps from packed tarballs or the live registry"
        type: choice
        options: [pack, registry]
        default: pack
      expect_version:
        description: "Optional. After install, assert the resolved @pylair/cli, @pylair/client and create-pylair versions equal this (e.g. 0.1.0-rc.28)"
        type: string
        required: false
        default: ""
      dispatch_id:
        description: "Optional correlation id echoed in the run name (set by release tooling, never required)"
        type: string
        required: false
        default: ""
  push:
    paths:
      - "packages/client/**"
      - "packages/cli/**"
      - "packages/create-pylair/**"
      - ".github/workflows/acceptance-registry.yml"

# A newer push to the same ref cancels the older push run (as ci.yml does).
# Manual dispatches get a group of their own: the release train dispatches this
# workflow for pack and for registry mode, and one must never cancel another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

# Scaffold + build + self-test on a clean machine — read-only by design.
permissions:
  contents: read

env:
  SOURCE: ${{ inputs.source || 'pack' }}
  # Scaffolded-app `uv sync` resolves outside the repo, so .python-version
  # can't reach it — pin every uv call to the bundled-runtime family.
  UV_PYTHON: "3.12"

jobs:
  # macOS runners are the scarce ones (about five at a time), and this workflow
  # alone used to ask for five on every push. On push only the Linux and
  # Windows legs run; a manual dispatch (the release train, before a publish)
  # keeps the full matrix, both macOS legs and the macOS wrap legs included.
  # The matrices are built here because a job-level `if` cannot see `matrix`:
  # a macOS leg that is "skipped" step by step would still occupy a runner.
  plan:
    name: Plan the matrices
    runs-on: ubuntu-22.04
    outputs:
      acceptance: ${{ steps.m.outputs.acceptance }}
      wrap: ${{ steps.m.outputs.wrap }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
        run: |
          ACCEPTANCE='{"include":[{"os":"ubuntu-22.04"},{"os":"windows-latest"},{"os":"windows-latest","build_shell":"pwsh"},{"os":"macos-latest"},{"os":"macos-15-intel"}]}'
          WRAP='{"os":["ubuntu-22.04","windows-latest","macos-latest"],"framework":["command","gradio","streamlit"],"include":[{"os":"ubuntu-22.04","bundles":"deb"},{"os":"windows-latest","bundles":"nsis"},{"os":"macos-latest","bundles":"app"},{"os":"windows-latest","framework":"command","build_shell":"pwsh"}]}'
          if [ "$EVENT" != "workflow_dispatch" ]; then
            ACCEPTANCE=$(jq -c '.include |= map(select(.os | startswith("macos") | not))' <<<"$ACCEPTANCE")
            WRAP=$(jq -c '.os |= map(select(startswith("macos") | not)) | .include |= map(select(.os | startswith("macos") | not))' <<<"$WRAP")
          fi
          echo "acceptance=$(jq -c . <<<"$ACCEPTANCE")" >> "$GITHUB_OUTPUT"
          echo "wrap=$(jq -c . <<<"$WRAP")" >> "$GITHUB_OUTPUT"
          echo "event: $EVENT"
          jq . <<<"$ACCEPTANCE"
          jq . <<<"$WRAP"

  acceptance:
    name: registry-acceptance (${{ matrix.os }}${{ matrix.build_shell && format('-{0}', matrix.build_shell) || '' }}, ${{ inputs.source || 'pack' }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Built by `plan`. The full matrix (dispatch): ubuntu, windows, a second
      # Windows leg under pwsh (git-bash resolves GNU tar, pwsh resolves
      # System32 bsdtar: both PATH orderings get tested so tool-variance bugs
      # cannot come back unnoticed), macos-latest and macos-15-intel.
      matrix: ${{ fromJSON(needs.plan.outputs.acceptance) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          # Only pack mode runs `pnpm install` in the workspace — in
          # registry mode the store dir never exists and setup-node's
          # post-job cache save fails the whole leg.
          cache: ${{ (inputs.source || 'pack') == 'pack' && 'pnpm' || '' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Matrix legs race on a shared cache key — the loser logs a
          # warning, not a failure. Per-leg suffixes keep saves quiet.
          cache-suffix: ${{ matrix.os }}-${{ matrix.build_shell }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build workspace packages
        if: ${{ (inputs.source || 'pack') == 'pack' }}
        # bash, not the Windows-default pwsh: a failed native command
        # mid-block does not fail a pwsh step unless it's the last one.
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: npm-pack the three packages
        if: ${{ (inputs.source || 'pack') == 'pack' }}
        shell: bash
        run: |
          # Workspace-relative paths: $RUNNER_TEMP is D:\... on Windows and
          # GNU tar parses the drive colon as a remote host:file spec — even
          # --force-local only protects the -f operand, not -C.
          mkdir -p packs
          PACKS=$(pwd)/packs
          for p in packages/client packages/cli packages/create-pylair; do
            (cd "$p" && npm pack --pack-destination "$PACKS" >/dev/null)
          done
          ls -la packs

      - name: Scaffold from the packed create-pylair tarball
        if: ${{ (inputs.source || 'pack') == 'pack' }}
        shell: bash
        run: |
          mkdir -p cp-src
          # Plain tar — all paths are relative so there's no colon for
          # GNU tar to misparse, and --force-local doesn't exist on
          # macOS's BSD tar.
          tar -xzf packs/create-pylair-*.tgz -C cp-src
          node cp-src/package/dist/index.js app-under-test

      - name: Scaffold from the registry (@next)
        if: ${{ inputs.source == 'registry' }}
        run: npx -y create-pylair@next app-under-test

      - name: Install app deps
        working-directory: app-under-test
        shell: bash
        run: |
          if [ "$SOURCE" = pack ]; then
            # Tarballs FIRST — the scaffolded pins point at versions that
            # aren't on the registry yet, so a bare npm install 404s.
            npm install ../packs/pylair-client-*.tgz ../packs/pylair-cli-*.tgz
          fi
          npm install
          uv sync

      - name: Assert resolved package versions match expect_version
        if: ${{ inputs.expect_version != '' }}
        working-directory: app-under-test
        env:
          EXPECT: ${{ inputs.expect_version }}
        # bash, not the Windows-default pwsh: a failed native command
        # mid-block does not fail a pwsh step unless it's the last one.
        shell: bash
        run: |
          # Input reaches the shell via env only — never expression syntax
          # inside run: (script-injection surface). Validate shape once.
          if [[ "$EXPECT" == *$'\n'* || "$EXPECT" == *$'\r'* ]] || \
             [[ ! "$EXPECT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid expect_version input: '$EXPECT'"
            exit 1
          fi

          fail=0
          check() { # $1 label, $2 resolved version
            if [ "$2" != "$EXPECT" ]; then
              echo "::error::$1 resolved to '$2' but expect_version is '$EXPECT' - the registry served something else"
              fail=1
            else
              echo "$1 resolved to $2 as expected"
            fi
          }

          check "@pylair/cli"    "$(node -p "require('./node_modules/@pylair/cli/package.json').version")"
          check "@pylair/client" "$(node -p "require('./node_modules/@pylair/client/package.json').version")"
          # create-pylair is the scaffolder, not an app dep — pack mode
          # keeps the unpacked tarball under cp-src, registry mode asks
          # npm what the @next tag resolved to.
          if [ "$SOURCE" = pack ]; then
            check "create-pylair" "$(node -p "require('../cp-src/package/package.json').version")"
          else
            check "create-pylair" "$(npm view create-pylair@next version)"
          fi
          exit $fail

      - name: Two-window capability — only when the resolved crate supports it
        working-directory: app-under-test/src-tauri
        shell: bash
        run: |
          # selftest-winb.json is deliberately NOT shipped in the template:
          # it grants emit/emitTo to a win-b label and references a
          # permission that exists only in crates carrying the
          # python_selftest_b_report command. Write it in only when the
          # resolved crate actually provides it — pack mode resolves the
          # published crate, so this is off until the rc.13 publish lands.
          cargo fetch -q
          PERM_FILE=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" \
            -path "*tauri-plugin-pylair-*/permissions/autogenerated/commands/python_selftest_b_report.toml" \
            -print -quit 2>/dev/null)
          if [ -n "$PERM_FILE" ]; then
            cp "$GITHUB_WORKSPACE/examples/reference-app/src-tauri/capabilities/selftest-winb.json" \
               capabilities/selftest-winb.json
            echo "PYLAIR_WINB_CAP=1" >> "$GITHUB_ENV"
            echo "two-window self-test capability written (resolved crate carries the permission)"
            CRATE_VER=$(grep -A1 'name = "tauri-plugin-pylair"' Cargo.lock \
              | grep -o 'version = "[^"]*"' | head -1 | cut -d'"' -f2)
            # Per-function permissions: the canonical file denies `add` for
            # win-b, and the self-test then REQUIRES win-b to be denied.
            # A published crate predating fn scoping (no src/fn_scope.rs)
            # cannot enforce that: write the file without the deny entry and
            # leave out the fixture function, so the client reports
            # "fn-permission": "skipped: ..." instead of failing. Once the
            # resolved crate has fn scoping the check is mandatory again.
            FNSCOPE=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" \
              -path "*tauri-plugin-pylair-$CRATE_VER/src/fn_scope.rs" -print -quit 2>/dev/null)
            if [ -n "$FNSCOPE" ]; then
              cat >> ../backend/app.py <<'PYEOF'

          @expose
          def fn_permissions_fixture() -> None:
              return None
          PYEOF
              echo "fn_permissions_fixture appended (resolved crate $CRATE_VER enforces per-function permissions)"
            else
              node -e 'const fs=require("fs");const f="capabilities/selftest-winb.json";const j=JSON.parse(fs.readFileSync(f,"utf8"));j.permissions=j.permissions.map(p=>typeof p==="object"&&p.identifier==="pylair:default"?"pylair:default":p);fs.writeFileSync(f,JSON.stringify(j,null,2))'
              echo "resolved crate $CRATE_VER predates per-function permissions: selftest-winb.json written WITHOUT the deny entry, fn-permission will be skipped"
            fi
            # The stderr probe additionally needs the resolved crate's
            # stderr_targets filter: a published crate predating it
            # broadcasts stderr by design and would fail on the missing
            # feature. Grep the lockfile-pinned crate source; the client
            # self-test skips the probe when the fixture is absent.
            LIBRS=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" \
              -path "*tauri-plugin-pylair-$CRATE_VER/src/lib.rs" -print -quit 2>/dev/null)
            if [ -n "$LIBRS" ] && grep -q "stderr_targets" "$LIBRS"; then
              # The stderr-scoping check needs an exposed function writing
              # to stderr; the template deliberately ships without one (a
              # test-only fixture must not ship).
              cat >> ../backend/app.py <<'PYEOF'

          import sys


          @expose
          def log_stderr(msg: str) -> None:
              print(msg, file=sys.stderr)
          PYEOF
              echo "log_stderr appended (resolved crate carries stderr scoping)"
            else
              echo "resolved crate predates stderr scoping — stderr probe skipped"
            fi
            # Per-window fairness: the hold fixture arms the client's
            # window-fairness check. Only worth appending when the resolved
            # crate actually enforces shares (src/supervisor/fairness.rs) —
            # an older published client never calls it, and a new client
            # skips cleanly when the fixture is absent.
            FAIRRS=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" \
              -path "*tauri-plugin-pylair-$CRATE_VER/src/supervisor/fairness.rs" -print -quit 2>/dev/null)
            if [ -n "$FAIRRS" ]; then
              cat >> ../backend/app.py <<'PYEOF'


          # Per-window fairness self-test (decisions 0005): `hold`
          # occupies a task slot until cancelled; `holds_active` is the
          # rendezvous win-b polls before probing its own share. `b_ping`
          # is win-b's liveness mark (the call itself subscribes it), so
          # `b_seen` >= 1 proves win-b is live before the flood starts.
          _holds_active = 0
          _b_seen = 0


          @expose
          async def hold(seconds: float = 30.0) -> str:
              global _holds_active
              _holds_active += 1
              try:
                  await asyncio.sleep(seconds)
                  return "held"
              finally:
                  _holds_active -= 1


          @expose
          def holds_active() -> int:
              return _holds_active


          @expose
          def b_ping() -> int:
              global _b_seen
              _b_seen += 1
              return _b_seen


          @expose
          def b_seen() -> int:
              return _b_seen
          PYEOF
              echo "hold/holds_active appended (resolved crate $CRATE_VER carries per-window fairness)"
            else
              echo "resolved crate predates per-window fairness — window-fairness check skipped"
            fi
            # Runtime health: python_health first ships in crate
            # 0.1.0-rc.19. On a crate that new a "skipped" health check
            # would hide a real break — e.g. allow-python-health missing
            # from pylair:default is an ACL regression the client's
            # uncoded rejection cannot tell from "command absent" — so
            # the self-test steps fail on it, mirroring ci.yml's
            # --local guard. Below rc.19 a skip stays legitimate.
            case "$CRATE_VER" in
              0.1.0-rc.*)
                RC_N=${CRATE_VER##0.1.0-rc.}
                if [ "$RC_N" -ge 19 ]; then HEALTH_OK=1; fi ;;
              *) HEALTH_OK=1 ;; # any non-rc line is at/past rc.19
            esac
            if [ -n "$HEALTH_OK" ]; then
              echo "PYLAIR_HEALTH_EXPECTED=1" >> "$GITHUB_ENV"
              echo "resolved crate $CRATE_VER carries python_health — a skipped health check fails the leg"
            else
              echo "resolved crate $CRATE_VER predates python_health (< 0.1.0-rc.19) — a skip stays legitimate"
            fi
            # App readiness (decisions 0007) needs BOTH resolved sides:
            # the pylair package (first release with the readiness API:
            # 0.1.0rc12 — proven by _readiness.py in the synced .venv,
            # same feature-file probe as the crate greps) and the crate
            # (first with health().app + pylair://app: 0.1.0-rc.20). The
            # fixture imports pylair's readiness API at module load, so
            # it is appended only when the package carries it; the
            # EXPECTED env arms only when the host can also report the
            # app block — mirroring PYLAIR_HEALTH_EXPECTED above.
            PYREADINESS=$(find ../.venv -path "*pylair/_readiness.py" -print -quit 2>/dev/null)
            APPREADY_CRATE=
            case "$CRATE_VER" in
              0.1.0-rc.*)
                RC_N=${CRATE_VER##0.1.0-rc.}
                if [ "$RC_N" -ge 20 ]; then APPREADY_CRATE=1; fi ;;
              *) APPREADY_CRATE=1 ;; # any non-rc line is at/past rc.20
            esac
            if [ -n "$PYREADINESS" ]; then
              cat >> ../backend/app.py <<'PYEOF'

          # App-readiness self-test (decisions 0007): the startup hook
          # reports the "selftest" component loading then ready, and
          # selftest_ping is gated on it via requires=. The ping/done
          # pair re-reports the cycle as two REAL transitions — a
          # single loading+ready inside one call would coalesce to a
          # no-op on the wire — so a webview subscribed to pylair://app
          # observes a phase event deterministically.
          from pylair import loading, on_startup, ready


          @on_startup
          def _selftest_component() -> None:
              loading("selftest", 0.5)
              ready("selftest")


          @expose(requires=("selftest",))
          def selftest_ping() -> str:
              loading("selftest", 0.9)
              return "pong"


          @expose
          def selftest_done() -> str:
              ready("selftest")
              return "done"
          PYEOF
              echo "app-readiness fixture appended (resolved pylair carries the readiness API)"
            else
              echo "resolved pylair predates app readiness (< 0.1.0rc12) — fixture not appended"
            fi
            if [ -n "$PYREADINESS" ] && [ -n "$APPREADY_CRATE" ]; then
              echo "PYLAIR_APP_READINESS_EXPECTED=1" >> "$GITHUB_ENV"
              echo "pylair + crate $CRATE_VER carry app readiness — a skipped check fails the leg"
            else
              echo "app readiness not fully resolved (crate $CRATE_VER, pylair fixture: ${PYREADINESS:+yes}${PYREADINESS:-no}) — a skip stays legitimate"
            fi
            # Warm workers (decisions 0008) live entirely in the pylair
            # package — the host sees only isolated tasks, so the gate
            # is one-sided on the resolved package version (first
            # release with warm workers: 0.1.0rc13). The dist-info dir
            # in the synced .venv is the resolved version, the same
            # probe style as the crate greps above. The fixture uses
            # worker={"mode":"warm"}, so it is appended only when the
            # package can decorate it; EXPECTED arms on the same gate —
            # a skip then hides a fixture regression.
            PYDIST=$(basename "$(find ../.venv -type d -name 'pylair-*.dist-info' -print -quit 2>/dev/null)" .dist-info 2>/dev/null)
            PY_VER=${PYDIST#pylair-}
            WARM_PY=
            case "$PY_VER" in
              0.1.0rc*)
                RC_N=${PY_VER##0.1.0rc}
                if [ "$RC_N" -ge 13 ]; then WARM_PY=1; fi ;;
              "") ;; # no pylair resolved — nothing to arm
              *) WARM_PY=1 ;; # any non-rc release is at/past rc13
            esac
            if [ -n "$WARM_PY" ]; then
              cat >> ../backend/app.py <<'PYEOF'

          # Warm-worker self-test (decisions 0008): the check asserts per
          # platform — POSIX interrupts the cancelled call and the same
          # member serves the next call; Windows is kill-only and a
          # respawned member has a new pid.
          import os as _os
          import sys as _sys
          import time as _time


          @expose(worker={"mode": "warm"})
          def warm_selftest(seconds: float = 0.0) -> dict:
              _time.sleep(seconds)
              return {"pid": _os.getpid(), "platform": _sys.platform}
          PYEOF
              echo "PYLAIR_WARM_EXPECTED=1" >> "$GITHUB_ENV"
              echo "warm_selftest appended (resolved pylair $PY_VER carries warm workers) — a skipped check fails the leg"
            else
              echo "resolved pylair ${PY_VER:-<none>} predates warm workers (< 0.1.0rc13) — a skip stays legitimate"
            fi
            # The model manager (decisions 0009) needs BOTH resolved
            # sides: the pylair package (first release with
            # pylair.models: 0.1.0rc14) and the crate (first passing
            # PYLAIR_APP_DATA_DIR into the runtime: 0.1.0-rc.22 —
            # without it the fixture fails the component). Same probe
            # style as the warm gate above; EXPECTED arms on the same
            # gate, so a skip then hides a fixture regression.
            MODELS_PY=
            case "$PY_VER" in
              0.1.0rc*)
                RC_N=${PY_VER##0.1.0rc}
                if [ "$RC_N" -ge 14 ]; then MODELS_PY=1; fi ;;
              "") ;; # no pylair resolved — nothing to arm
              *) MODELS_PY=1 ;; # any non-rc release is at/past rc14
            esac
            MODELS_CRATE=
            case "$CRATE_VER" in
              0.1.0-rc.*)
                RC_N=${CRATE_VER##0.1.0-rc.}
                if [ "$RC_N" -ge 22 ]; then MODELS_CRATE=1; fi ;;
              *) MODELS_CRATE=1 ;; # any non-rc line is at/past rc.22
            esac
            if [ -n "$MODELS_PY" ] && [ -n "$MODELS_CRATE" ]; then
              cat >> ../backend/app.py <<'PYEOF'

          # Model-manager self-test (decisions 0009): a loopback-only
          # HTTP server inside the runtime serves a known blob;
          # models_selftest_fetch downloads + verifies it and asserts
          # the second fetch took the sidecar fast path (the server
          # counts hits — it must stay 1). The warm-worker fixture
          # resolves the verified file read-only — it can never fetch —
          # and cleanup removes the model from the app data dir
          # afterwards. http:// is loopback-only here; the opt-in is
          # scoped to this app.
          import hashlib as _m_hashlib
          import os as _m_os
          import threading as _m_threading
          from http.server import BaseHTTPRequestHandler as _m_BHRH
          from http.server import ThreadingHTTPServer as _m_THS
          from pathlib import Path as _m_Path

          _MODEL_BLOB = _m_hashlib.sha256(b"pylair-selftest-model").digest() * 8192
          _MODEL_SHA = _m_hashlib.sha256(_MODEL_BLOB).hexdigest()
          _model_state: dict = {"server": None, "hits": 0, "url": None}


          class _ModelHandler(_m_BHRH):
              def log_message(self, *args):
                  pass

              def do_GET(self):
                  blob = _MODEL_BLOB
                  _model_state["hits"] += 1
                  start = 0
                  status = 200
                  rng = self.headers.get("Range")
                  if rng and rng.startswith("bytes="):
                      try:
                          start = int(rng[6:].split("-", 1)[0])
                      except ValueError:
                          start = 0
                      if 0 < start < len(blob):
                          status = 206
                      else:
                          start = 0
                  body = blob[start:]
                  self.send_response(status)
                  self.send_header("Content-Length", str(len(body)))
                  if status == 206:
                      self.send_header(
                          "Content-Range", f"bytes {start}-{len(blob) - 1}/{len(blob)}"
                      )
                  self.end_headers()
                  # wfile.write is a single send() and can return short — sendall.
                  self.connection.sendall(body)


          def _models_server_url() -> str:
              if _model_state["server"] is None:
                  srv = _m_THS(("127.0.0.1", 0), _ModelHandler)
                  _m_threading.Thread(target=srv.serve_forever, daemon=True).start()
                  _model_state["server"] = srv
                  _model_state["url"] = f"http://127.0.0.1:{srv.server_port}/m"
              return _model_state["url"]


          @expose
          def models_selftest_fetch() -> dict:
              # Loopback http is allowed only around the two fetch
              # calls: the previous value is saved, then restored in
              # finally (deleted when it was unset), so plain-http
              # stays refused for the rest of the process.
              prev = _m_os.environ.get("PYLAIR_MODELS_ALLOW_INSECURE")
              _m_os.environ["PYLAIR_MODELS_ALLOW_INSECURE"] = "1"
              try:
                  from pylair import models

                  url = _models_server_url()
                  kw = {"url": url, "sha256": _MODEL_SHA, "size": len(_MODEL_BLOB)}
                  models.fetch("selftest-model", **kw)
                  models.fetch("selftest-model", **kw)
              finally:
                  if prev is None:
                      _m_os.environ.pop("PYLAIR_MODELS_ALLOW_INSECURE", None)
                  else:
                      _m_os.environ["PYLAIR_MODELS_ALLOW_INSECURE"] = prev
              if _model_state["hits"] != 1:
                  raise RuntimeError(
                      f"second fetch was not the sidecar fast path "
                      f"(hits={_model_state['hits']})"
                  )
              root = models.dir("selftest-model")
              app_data = _m_os.environ.get("PYLAIR_APP_DATA_DIR", "")
              if not app_data or root != _m_Path(app_data) / "models":
                  raise RuntimeError(
                      f"model root {root} is not <app-data>/models ({app_data!r})"
                  )
              p = models.path("selftest-model")
              if p.parent != root:
                  raise RuntimeError(f"models.path {p} is not under {root}")
              return {
                  "path": str(p),
                  "root": str(root),
                  "hits": _model_state["hits"],
                  "insecure_after": _m_os.environ.get("PYLAIR_MODELS_ALLOW_INSECURE"),
              }


          @expose(worker={"mode": "warm"})
          def models_warm_path() -> dict:
              # Resolve-only inside a warm worker — it can never
              # download, so a returned path proves the verified file
              # is shared across processes.
              from pylair import models

              return {"path": str(models.path("selftest-model")), "pid": _m_os.getpid()}


          @expose
          def models_selftest_cleanup() -> dict:
              from pylair import models

              root = models.dir("selftest-model")
              if root.is_dir():
                  for f in root.glob("selftest-model*"):
                      f.unlink(missing_ok=True)
              srv = _model_state.get("server")
              if srv is not None:
                  srv.shutdown()
                  _model_state["server"] = None
              return {"removed": True}
          PYEOF
              echo "PYLAIR_MODELS_EXPECTED=1" >> "$GITHUB_ENV"
              echo "models fixtures appended (pylair $PY_VER + crate $CRATE_VER carry the model manager) — a skipped check fails the leg"
            else
              echo "model manager not fully resolved (pylair ${PY_VER:-<none>}, crate $CRATE_VER) — a skip stays legitimate"
            fi
          else
            echo "resolved crate predates python_selftest_b_report — two-window self-test skipped"
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app-under-test/src-tauri

      - name: pylair build
        if: ${{ !(runner.os == 'Windows' && matrix.build_shell == 'pwsh') }}
        working-directory: app-under-test
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) npx pylair build --bundles nsis ;;
            macOS)   npx pylair build ;;  # default bundles: .app + .dmg — exercises the dmg repackage
            *)       npx pylair build --bundles deb ;;
          esac

      - name: pylair build (pwsh — System32 tar ordering)
        if: ${{ runner.os == 'Windows' && matrix.build_shell == 'pwsh' }}
        working-directory: app-under-test
        shell: pwsh
        run: npx pylair build --bundles nsis

      - name: Tripwire — release exe is a GUI binary (Windows)
        if: runner.os == 'Windows'
        working-directory: app-under-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'src-tauri/target/release/app-under-test.exe'
          if (-not (Test-Path $exe)) { Write-Error "release exe not found: $exe"; exit 1 }
          # PE optional-header Subsystem: 2 = WINDOWS_GUI, 3 = CONSOLE. A
          # console-subsystem release exe pops a terminal on every launch.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe).Path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $sub = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($sub -ne 2) { Write-Error "PE subsystem $sub — expected 2 (GUI)"; exit 1 }
          Write-Output "PE subsystem = $sub (GUI)"

      - name: Self-test installed app (Linux, clean container, no Python)
        if: runner.os == 'Linux'
        working-directory: app-under-test
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          dpkg -x "$DEB" /tmp/approot
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          # Bare ubuntu:22.04 has NO python — --self-test exits before the
          # Tauri loop/GTK init but still needs its linked system libs.
          docker run --rm -e PYLAIR_WINB_CAP -e PYLAIR_HEALTH_EXPECTED -e PYLAIR_APP_READINESS_EXPECTED -e PYLAIR_WARM_EXPECTED -e PYLAIR_MODELS_EXPECTED -v /tmp/approot:/r:ro -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" ubuntu:22.04 bash -c '
            set -eo pipefail; export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3; do apt-get update -qq && break || sleep 10; done
            apt-get install -y -qq libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 ca-certificates xvfb >/dev/null
            /r/usr/bin/app-under-test --self-test
            # WindowDestroyed on the main thread — the rc.3 window-close panic.
            PYLAIR_SELF_TEST_WINDOW_CLOSE=1 timeout 90 xvfb-run -a /r/usr/bin/app-under-test
            # Two-window event-scoping test — only when the resolved crate
            # carried the selftest-winb capability (see the capability step).
            if [ "$PYLAIR_WINB_CAP" = "1" ]; then
              PYLAIR_SELF_TEST_WEBVIEW=1 PYLAIR_MAX_TASKS=4 timeout 120 xvfb-run -a /r/usr/bin/app-under-test | tee /tmp/wst.log
              # rc.19+ carries python_health — a skipped check hides an
              # ACL regression, so it fails the leg (ci.yml --local guard).
              # Exact key — a loose "health.*skipped" would also match a
              # later legitimately-skipped check on the one-line JSON.
              # Escaped double quotes — inside the quoted docker script.
              if [ "$PYLAIR_HEALTH_EXPECTED" = "1" ] && grep -q "\"health\":\"skipped" /tmp/wst.log; then
                echo "health skipped but resolved crate carries python_health" >&2
                exit 1
              fi
              # Same contract for app readiness: armed only when BOTH the
              # resolved crate (>= rc.20) and pylair (>= 0.1.0rc12) carry
              # it — a skip then hides a fixture/host regression.
              if [ "$PYLAIR_APP_READINESS_EXPECTED" = "1" ] && grep -q "\"app-readiness\":\"skipped" /tmp/wst.log; then
                echo "app-readiness skipped but resolved crate + pylair carry app readiness" >&2
                exit 1
              fi
              # Warm workers: armed only when the resolved pylair is
              # 0.1.0rc13 or later — a skip then hides a fixture
              # regression (exact key, escaped quotes as above).
              if [ "$PYLAIR_WARM_EXPECTED" = "1" ] && grep -q "\"warm-workers\":\"skipped" /tmp/wst.log; then
                echo "warm-workers skipped but resolved pylair carries warm workers" >&2
                exit 1
              fi
              # The model manager: armed only when BOTH the resolved
              # pylair (>= 0.1.0rc14) and crate (>= 0.1.0-rc.22, for
              # PYLAIR_APP_DATA_DIR) carry it — a skip then hides a
              # fixture/host regression (exact key, escaped quotes).
              if [ "$PYLAIR_MODELS_EXPECTED" = "1" ] && grep -q "\"models\":\"skipped" /tmp/wst.log; then
                echo "models skipped but resolved pylair + crate carry the model manager" >&2
                exit 1
              fi
            fi
            # Lifecycle containment: clean close, SIGKILL of the host,
            # restart — the script asserts no runtime/worker survivors.
            bash /scripts/dogfood-linux.sh --exe /r/usr/bin/app-under-test'

      - name: Self-test installed app (Windows, silent NSIS install)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: app-under-test
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { Write-Error 'nsis installer not found'; exit 1 }
          $inst = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($inst.ExitCode -ne 0) { Write-Error "nsis install exit $($inst.ExitCode)"; exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
                -Recurse -Filter 'app-under-test.exe' -Depth 4 -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $exe) { Write-Error 'installed app-under-test.exe not found'; exit 1 }
          Write-Output "installed app: $($exe.FullName)"
          # GUI-subsystem exe: `&` returns immediately and $LASTEXITCODE is
          # stale — wait on the process handle and read the real ExitCode.
          $st = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -PassThru
          if (-not $st.WaitForExit(120000)) { $st.Kill(); Write-Error 'self-test timed out'; exit 1 }
          if ($st.ExitCode -ne 0) { Write-Error "self-test exit $($st.ExitCode)"; exit 1 }
          # WindowDestroyed on the main thread — the rc.3 window-close panic.
          $env:PYLAIR_SELF_TEST_WINDOW_CLOSE = '1'
          $wc = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $wc.WaitForExit(120000)) { $wc.Kill(); Write-Error 'window-close self-test timed out'; exit 1 }
          if ($wc.ExitCode -ne 0) { Write-Error "window-close self-test exit $($wc.ExitCode)"; exit 1 }
          $env:PYLAIR_SELF_TEST_WINDOW_CLOSE = $null
          # Two-window event-scoping test — only when the resolved crate
          # carried the selftest-winb capability (see the capability step).
          if ($env:PYLAIR_WINB_CAP -eq '1') {
            $env:PYLAIR_SELF_TEST_WEBVIEW = '1'
            $env:PYLAIR_MAX_TASKS = '4'
            # stdout/stderr redirected so the verdict JSON lands in the
            # log and the health skip-guard can read it (a GUI exe's
            # output otherwise never reaches the runner log — ci.yml).
            $out = Join-Path $env:TEMP 'wst-out.txt'
            $err = Join-Path $env:TEMP 'wst-err.txt'
            $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $env:TEMP `
                  -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error 'webview self-test timed out'; exit 1 }
            Get-Content $out,$err -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { Write-Error "webview self-test exit $($p.ExitCode)"; exit 1 }
            # rc.19+ carries python_health — a skipped check hides an
            # ACL regression, so it fails the leg (ci.yml --local guard).
            if ($env:PYLAIR_HEALTH_EXPECTED -eq '1' -and
                (Select-String -Path $out -Pattern '"health":"skipped' -Quiet -ErrorAction SilentlyContinue)) {
              Write-Error 'health skipped but resolved crate carries python_health'
              exit 1
            }
            if ($env:PYLAIR_APP_READINESS_EXPECTED -eq '1' -and
                (Select-String -Path $out -Pattern '"app-readiness":"skipped' -Quiet -ErrorAction SilentlyContinue)) {
              Write-Error 'app-readiness skipped but resolved crate + pylair carry app readiness'
              exit 1
            }
            if ($env:PYLAIR_WARM_EXPECTED -eq '1' -and
                (Select-String -Path $out -Pattern '"warm-workers":"skipped' -Quiet -ErrorAction SilentlyContinue)) {
              Write-Error 'warm-workers skipped but resolved pylair carries warm workers'
              exit 1
            }
            if ($env:PYLAIR_MODELS_EXPECTED -eq '1' -and
                (Select-String -Path $out -Pattern '"models":"skipped' -Quiet -ErrorAction SilentlyContinue)) {
              Write-Error 'models skipped but resolved pylair + crate carry the model manager'
              exit 1
            }
            $env:PYLAIR_SELF_TEST_WEBVIEW = $null
            $env:PYLAIR_MAX_TASKS = $null
          }

      - name: Dogfood lifecycle (Windows — close, kill, restart)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
                -Recurse -Filter 'app-under-test.exe' -Depth 4 -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $exe) { Write-Error 'installed app-under-test.exe not found'; exit 1 }
          & "$env:GITHUB_WORKSPACE\scripts\dogfood-windows.ps1" `
                -ExePath $exe.FullName -InstallDir (Split-Path $exe.FullName -Parent)
          if ($LASTEXITCODE -ne 0) { Write-Error "dogfood exit $LASTEXITCODE"; exit 1 }

      - name: Self-test installed app (macOS, isolated .app, scrubbed env)
        if: runner.os == 'macOS'
        working-directory: app-under-test
        run: |
          # pipefail: the webview self-test tees its log below — without
          # it a failing app exit is masked by tee's 0.
          set -eo pipefail
          # Take the app from the DMG — the artifact a user downloads,
          # not the intermediate under bundle/macos. Proves the signed
          # app is what ships in the image.
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$DMG" || { echo "no .dmg under bundle/dmg"; exit 1; }
          mkdir -p dmg-mnt
          hdiutil attach -nobrowse -readonly -mountpoint dmg-mnt "$DMG"
          APP=$(find dmg-mnt -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "no .app inside the dmg"; hdiutil detach dmg-mnt -quiet; exit 1; }
          # Isolate: delete the project venv and copy the bundle out, so
          # the app cannot lean on the workspace's Python by path.
          rm -rf .venv
          ditto "$APP" ../isolated-app.app
          hdiutil detach dmg-mnt -quiet
          ISOLATED="$(cd .. && pwd)/isolated-app.app"
          PYBIN="$ISOLATED/Contents/Resources/python/bin/python3"
          test -x "$PYBIN" || { echo "bundled interpreter missing: $PYBIN"; exit 1; }
          echo "== signing status (informational — unsigned RCs expected) =="
          codesign -dv "$ISOLATED" 2>&1 || true
          codesign --verify --deep --strict "$ISOLATED" 2>&1 || true
          codesign -dv "$PYBIN" 2>&1 || true
          # /usr/bin/python3 exists on runners — a scrubbed PATH alone
          # proves nothing; the interpreter itself must report its home
          # inside THIS copy's Resources.
          EXE=$(env -i PATH=/usr/bin:/bin "$PYBIN" -c 'import sys; print(sys.executable)')
          echo "bundled sys.executable: $EXE"
          case "$EXE" in
            "$ISOLATED/Contents/Resources/"*) ;;
            *) echo "bundled interpreter reports outside Resources: $EXE"; exit 1 ;;
          esac
          echo "== --self-test: real bridge call through bundled runtime =="
          env -i PATH=/usr/bin:/bin "$ISOLATED/Contents/MacOS/$(basename "$APP" .app)" --self-test
          # WindowDestroyed on the main thread — the rc.3 window-close panic.
          env -i PATH=/usr/bin:/bin PYLAIR_SELF_TEST_WINDOW_CLOSE=1 "$ISOLATED/Contents/MacOS/$(basename "$APP" .app)"
          # Two-window event-scoping test — only when the resolved crate
          # carried the selftest-winb capability (see the capability step).
          if [ "$PYLAIR_WINB_CAP" = "1" ]; then
            env -i PATH=/usr/bin:/bin PYLAIR_SELF_TEST_WEBVIEW=1 PYLAIR_MAX_TASKS=4 "$ISOLATED/Contents/MacOS/$(basename "$APP" .app)" | tee /tmp/wst.log
            # rc.19+ carries python_health — a skipped check hides an
            # ACL regression, so it fails the leg (ci.yml --local guard).
            if [ "$PYLAIR_HEALTH_EXPECTED" = "1" ] && grep -q '"health":"skipped' /tmp/wst.log; then
              echo "health skipped but resolved crate carries python_health" >&2
              exit 1
            fi
            if [ "$PYLAIR_APP_READINESS_EXPECTED" = "1" ] && grep -q '"app-readiness":"skipped' /tmp/wst.log; then
              echo "app-readiness skipped but resolved crate + pylair carry app readiness" >&2
              exit 1
            fi
            if [ "$PYLAIR_WARM_EXPECTED" = "1" ] && grep -q '"warm-workers":"skipped' /tmp/wst.log; then
              echo "warm-workers skipped but resolved pylair carries warm workers" >&2
              exit 1
            fi
            if [ "$PYLAIR_MODELS_EXPECTED" = "1" ] && grep -q '"models":"skipped' /tmp/wst.log; then
              echo "models skipped but resolved pylair + crate carry the model manager" >&2
              exit 1
            fi
          fi

  # Wrap mode from the shipped artifacts: ci.yml's wrap-acceptance gives
  # this proof for a checkout (--local); this job gives it for what users
  # get: `create-pylair --mode wrap` from the packed tarball or registry
  # @next, the same framework fixtures, `pylair build`, and the installed
  # wrap self-test per OS (WebView2, WKWebView, WebKitGTK under xvfb).
  # Pack mode still resolves the Python pin and the crate pin from the
  # live registries; they must be published before either mode is green.
  wrap-acceptance:
    name: registry-wrap (${{ matrix.os }}, ${{ matrix.framework }}${{ matrix.build_shell && format('-{0}', matrix.build_shell) || '' }}, ${{ inputs.source || 'pack' }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      APP_DIR: wrap-app
      APP_BIN: wrap-app
      # Gradio embeds the page title in the config `GET /` serves; FastAPI
      # serves the marker itself; Streamlit renders over a websocket, so its
      # static shell (title "Streamlit") is what a GET can see.
      MARKER: ${{ matrix.framework == 'streamlit' && 'Streamlit' || 'PYLAIR-WRAP-OK' }}
    strategy:
      fail-fast: false
      # Built by `plan`: os x framework, one bundle per OS (enough to install
      # and run the app), and a pwsh build leg for windows/command (the bridge
      # matrix runs a second Windows leg under pwsh so System32 bsdtar
      # ordering gets exercised on `pylair build`; one leg covers it here, the
      # other Windows legs build on bash). macOS only on manual dispatch.
      matrix: ${{ fromJSON(needs.plan.outputs.wrap) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          # Only pack mode runs `pnpm install` in the workspace; in
          # registry mode the store dir never exists and setup-node's
          # post-job cache save fails the whole leg.
          cache: ${{ (inputs.source || 'pack') == 'pack' && 'pnpm' || '' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          # One uv cache per leg: gradio and streamlit wheels are the
          # slow part, and a FastAPI leg should not restore them.
          cache-suffix: wrap-${{ matrix.os }}-${{ matrix.framework }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build workspace packages
        if: ${{ (inputs.source || 'pack') == 'pack' }}
        # bash, not the Windows-default pwsh: a failed native command
        # mid-block does not fail a pwsh step unless it's the last one.
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: npm-pack the packages the wrap app needs
        if: ${{ (inputs.source || 'pack') == 'pack' }}
        shell: bash
        run: |
          # A wrap app depends on @pylair/cli only (no @pylair/client,
          # nothing talks to the bridge), plus create-pylair to scaffold.
          # Workspace-relative paths: $RUNNER_TEMP is D:\... on Windows
          # and GNU tar parses the drive colon as a remote host:file spec.
          mkdir -p packs
          PACKS=$(pwd)/packs
          for p in packages/cli packages/create-pylair; do
            (cd "$p" && npm pack --pack-destination "$PACKS" >/dev/null)
          done
          ls -la packs

      - name: Scaffold the wrap app from the packed create-pylair tarball
        if: ${{ (inputs.source || 'pack') == 'pack' }}
        shell: bash
        run: |
          mkdir -p cp-src
          # Plain tar: all paths are relative so there's no colon for
          # GNU tar to misparse, and --force-local doesn't exist on
          # macOS's BSD tar.
          tar -xzf packs/create-pylair-*.tgz -C cp-src
          node cp-src/package/dist/index.js "$APP_DIR" --mode wrap
          node scripts/wrap-acceptance/prepare.mjs "$APP_DIR" ${{ matrix.framework }}

      - name: Scaffold the wrap app from the registry (@next)
        if: ${{ inputs.source == 'registry' }}
        # bash: two native commands; pwsh would only report the last
        # one's exit code.
        shell: bash
        run: |
          npx -y create-pylair@next "$APP_DIR" --mode wrap
          node scripts/wrap-acceptance/prepare.mjs "$APP_DIR" ${{ matrix.framework }}

      - name: Install app deps
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ "$SOURCE" = pack ]; then
            # Tarball FIRST: the scaffolded @pylair/cli pin points at a
            # version that isn't on the registry yet, so npm install 404s.
            npm install ../packs/pylair-cli-*.tgz
          fi
          npm install
          uv sync

      - name: Assert resolved package versions match expect_version
        if: ${{ inputs.expect_version != '' }}
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPECT: ${{ inputs.expect_version }}
        # bash, not the Windows-default pwsh: a failed native command
        # mid-block does not fail a pwsh step unless it's the last one.
        shell: bash
        run: |
          # Input reaches the shell via env only, never expression syntax
          # inside run: (script-injection surface). Validate shape once.
          if [[ "$EXPECT" == *$'\n'* || "$EXPECT" == *$'\r'* ]] || \
             [[ ! "$EXPECT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid expect_version input: '$EXPECT'"
            exit 1
          fi

          fail=0
          check() { # $1 label, $2 resolved version
            if [ "$2" != "$EXPECT" ]; then
              echo "::error::$1 resolved to '$2' but expect_version is '$EXPECT' - the registry served something else"
              fail=1
            else
              echo "$1 resolved to $2 as expected"
            fi
          }

          check "@pylair/cli"    "$(node -p "require('./node_modules/@pylair/cli/package.json').version")"
          # create-pylair is the scaffolder, not an app dep; pack mode
          # keeps the unpacked tarball under cp-src, registry mode asks
          # npm what the @next tag resolved to.
          if [ "$SOURCE" = pack ]; then
            check "create-pylair" "$(node -p "require('../cp-src/package/package.json').version")"
          else
            check "create-pylair" "$(npm view create-pylair@next version)"
          fi
          exit $fail

      # The Rust side is the same for every framework, so an OS's legs
      # share a cache, distinct from ci.yml's key since the resolved
      # crate here is the published one, not a path dep.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri
          shared-key: wrap-registry-${{ runner.os }}

      - name: pylair build
        if: ${{ !(runner.os == 'Windows' && matrix.build_shell == 'pwsh') }}
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: npx pylair build --bundles ${{ matrix.bundles }}

      - name: "pylair build (pwsh: System32 tar ordering)"
        if: ${{ runner.os == 'Windows' && matrix.build_shell == 'pwsh' }}
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: npx pylair build --bundles ${{ matrix.bundles }}

      - name: Installed wrap self-test (Linux, clean container, xvfb)
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          dpkg -x "$DEB" /tmp/approot
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          # Bare ubuntu:22.04: no Python, no framework, no GUI libs beyond
          # what the installed app needs. The REAL app runs under xvfb and
          # checks itself.
          docker run --rm -e APP_BIN -e MARKER -v /tmp/approot:/r:ro ubuntu:22.04 bash -c '
            set -eo pipefail; export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3; do apt-get update -qq && break || sleep 10; done
            apt-get install -y -qq libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 ca-certificates xvfb >/dev/null
            touch /tmp/wrap-restart-trigger
            export PYLAIR_SELF_TEST_WRAP="$MARKER" PYLAIR_SELF_TEST_WRAP_RESTART=1 PYLAIR_SELF_TEST_WRAP_CRASH=1 PYLAIR_RESTART_TRIGGER=/tmp/wrap-restart-trigger
            timeout 600 xvfb-run -a /r/usr/bin/$APP_BIN 2>&1 | tee /tmp/wrap-self-test.log
            grep -q "wrap-self-test: ok" /tmp/wrap-self-test.log'

      - name: Installed wrap self-test (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.APP_DIR }}
        run: |
          # pipefail: the wrap self-test tees its log below — without it a
          # failing app exit is masked by tee's 0.
          set -eo pipefail
          APP="$PWD/$(find src-tauri/target/release/bundle/macos -name '*.app' | head -1)"
          touch /tmp/wrap-restart-trigger
          # A clean environment, run from outside the checkout (as the
          # bridge leg does): no Python on PATH, nothing of the project
          # visible.
          cd /tmp
          env -i HOME="$HOME" PATH=/usr/bin:/bin \
            PYLAIR_SELF_TEST_WRAP="$MARKER" PYLAIR_SELF_TEST_WRAP_RESTART=1 PYLAIR_SELF_TEST_WRAP_CRASH=1 \
            PYLAIR_RESTART_TRIGGER=/tmp/wrap-restart-trigger \
            perl -e 'alarm 600; exec @ARGV' "$APP/Contents/MacOS/$APP_BIN" 2>&1 | tee /tmp/wrap-self-test.log
          grep -q "wrap-self-test: ok" /tmp/wrap-self-test.log

      - name: Installed wrap self-test (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $i = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $i) { Write-Error 'nsis installer not found'; exit 1 }
          $inst = Start-Process -FilePath $i.FullName -ArgumentList '/S' -Wait -PassThru
          if ($inst.ExitCode -ne 0) { Write-Error "nsis install exit $($inst.ExitCode)"; exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" `
                -Recurse -Filter "$env:APP_BIN.exe" -Depth 3 -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $exe) { Write-Error "installed $env:APP_BIN.exe not found"; exit 1 }
          $trigger = Join-Path $env:TEMP 'wrap-restart-trigger'
          Set-Content -Path $trigger -Value 'x'
          $env:PYLAIR_SELF_TEST_WRAP = $env:MARKER
          $env:PYLAIR_SELF_TEST_WRAP_RESTART = '1'
          $env:PYLAIR_SELF_TEST_WRAP_CRASH = '1'
          $env:PYLAIR_RESTART_TRIGGER = $trigger
          # A GUI-subsystem exe: redirect so the verdict lands in the log,
          # and wait on the process handle for the real exit code.
          $out = Join-Path $env:TEMP 'wrap-st-out.txt'
          $err = Join-Path $env:TEMP 'wrap-st-err.txt'
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $env:TEMP `
                -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $done = $p.WaitForExit(600000)
          Get-Content $out,$err -ErrorAction SilentlyContinue
          if (-not $done) { $p.Kill(); Write-Error 'wrap self-test timed out'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "wrap self-test exit $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path $out -Pattern 'wrap-self-test: ok' -Quiet)) {
            Write-Error 'no "wrap-self-test: ok" verdict in the output'; exit 1
          }
