name: Registry acceptance

# Scaffolds an app from the SHIPPED artifacts and proves the whole path:
# npm install → uv sync → pylair build → --self-test (real bridge call
# through the bundled interpreter, no display needed).
#
# Two modes:
#   source=pack     (default): npm-pack the three packages, scaffold from
#                    the packed create-pylair tarball, and install the app
#                    deps from the packed tarballs — catches what WOULD
#                    ship (missing files, bad names) before it can't be
#                    changed. Run after bumping versions, before publish.
#   source=registry: scaffold via `npx create-pylair@next` — post-publish
#                    verification of what users actually get.
#
# Registry-mode prerequisite: the pylair PyPI package and
# tauri-plugin-pylair crate versions pinned by the scaffolder must
# already be published — publish the crate first, then npm.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Install deps from packed tarballs or the live registry"
        type: choice
        options: [pack, registry]
        default: pack
  push:
    paths:
      - "packages/client/**"
      - "packages/cli/**"
      - "packages/create-pylair/**"
      - ".github/workflows/acceptance-registry.yml"

# Scaffold + build + self-test on a clean machine — read-only by design.
permissions:
  contents: read

env:
  SOURCE: ${{ inputs.source || 'pack' }}
  # Scaffolded-app `uv sync` resolves outside the repo, so .python-version
  # can't reach it — pin every uv call to the bundled-runtime family.
  UV_PYTHON: "3.12"

jobs:
  acceptance:
    name: registry-acceptance (${{ matrix.os }}${{ matrix.build_shell && format('-{0}', matrix.build_shell) || '' }}, ${{ inputs.source || 'pack' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04}
          - {os: windows-latest}
          # A second Windows leg under pwsh: git-bash resolves GNU tar,
          # pwsh resolves System32 bsdtar — both PATH orderings get tested
          # so tool-variance bugs can't come back unnoticed.
          - {os: windows-latest, build_shell: pwsh}
          - {os: macos-latest}
          - {os: macos-15-intel}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          # Only pack mode runs `pnpm install` in the workspace — in
          # registry mode the store dir never exists and setup-node's
          # post-job cache save fails the whole leg.
          cache: ${{ (inputs.source || 'pack') == 'pack' && 'pnpm' || '' }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          # Matrix legs race on a shared cache key — the loser logs a
          # warning, not a failure. Per-leg suffixes keep saves quiet.
          cache-suffix: ${{ matrix.os }}-${{ matrix.build_shell }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build workspace packages
        if: ${{ (inputs.source || 'pack') == 'pack' }}
        # bash, not the Windows-default pwsh: a failed native command
        # mid-block does not fail a pwsh step unless it's the last one.
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: npm-pack the three packages
        if: ${{ (inputs.source || 'pack') == 'pack' }}
        shell: bash
        run: |
          # Workspace-relative paths: $RUNNER_TEMP is D:\... on Windows and
          # GNU tar parses the drive colon as a remote host:file spec — even
          # --force-local only protects the -f operand, not -C.
          mkdir -p packs
          PACKS=$(pwd)/packs
          for p in packages/client packages/cli packages/create-pylair; do
            (cd "$p" && npm pack --pack-destination "$PACKS" >/dev/null)
          done
          ls -la packs

      - name: Scaffold from the packed create-pylair tarball
        if: ${{ (inputs.source || 'pack') == 'pack' }}
        shell: bash
        run: |
          mkdir -p cp-src
          # Plain tar — all paths are relative so there's no colon for
          # GNU tar to misparse, and --force-local doesn't exist on
          # macOS's BSD tar.
          tar -xzf packs/create-pylair-*.tgz -C cp-src
          node cp-src/package/dist/index.js app-under-test

      - name: Scaffold from the registry (@next)
        if: ${{ inputs.source == 'registry' }}
        run: npx -y create-pylair@next app-under-test

      - name: Install app deps
        working-directory: app-under-test
        shell: bash
        run: |
          if [ "$SOURCE" = pack ]; then
            # Tarballs FIRST — the scaffolded pins point at versions that
            # aren't on the registry yet, so a bare npm install 404s.
            npm install ../packs/pylair-client-*.tgz ../packs/pylair-cli-*.tgz
          fi
          npm install
          uv sync

      - name: Two-window capability — only when the resolved crate supports it
        working-directory: app-under-test/src-tauri
        shell: bash
        run: |
          # selftest-winb.json is deliberately NOT shipped in the template:
          # it grants emit/emitTo to a win-b label and references a
          # permission that exists only in crates carrying the
          # python_selftest_b_report command. Write it in only when the
          # resolved crate actually provides it — pack mode resolves the
          # published crate, so this is off until the rc.13 publish lands.
          cargo fetch -q
          PERM_FILE=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" \
            -path "*tauri-plugin-pylair-*/permissions/autogenerated/commands/python_selftest_b_report.toml" \
            -print -quit 2>/dev/null)
          if [ -n "$PERM_FILE" ]; then
            cp "$GITHUB_WORKSPACE/examples/reference-app/src-tauri/capabilities/selftest-winb.json" \
               capabilities/selftest-winb.json
            echo "PYLAIR_WINB_CAP=1" >> "$GITHUB_ENV"
            echo "two-window self-test capability written (resolved crate carries the permission)"
            # The stderr probe additionally needs the resolved crate's
            # stderr_targets filter: a published crate predating it
            # broadcasts stderr by design and would fail on the missing
            # feature. Grep the lockfile-pinned crate source; the client
            # self-test skips the probe when the fixture is absent.
            CRATE_VER=$(grep -A1 'name = "tauri-plugin-pylair"' Cargo.lock \
              | grep -o 'version = "[^"]*"' | head -1 | cut -d'"' -f2)
            LIBRS=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" \
              -path "*tauri-plugin-pylair-$CRATE_VER/src/lib.rs" -print -quit 2>/dev/null)
            if [ -n "$LIBRS" ] && grep -q "stderr_targets" "$LIBRS"; then
              # The stderr-scoping check needs an exposed function writing
              # to stderr; the template deliberately ships without one (a
              # test-only fixture must not ship).
              cat >> ../backend/app.py <<'PYEOF'

          import sys


          @expose
          def log_stderr(msg: str) -> None:
              print(msg, file=sys.stderr)
          PYEOF
              echo "log_stderr appended (resolved crate carries stderr scoping)"
            else
              echo "resolved crate predates stderr scoping — stderr probe skipped"
            fi
          else
            echo "resolved crate predates python_selftest_b_report — two-window self-test skipped"
          fi

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: app-under-test/src-tauri

      - name: pylair build
        if: ${{ !(runner.os == 'Windows' && matrix.build_shell == 'pwsh') }}
        working-directory: app-under-test
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) npx pylair build --bundles nsis ;;
            macOS)   npx pylair build ;;  # default bundles: .app + .dmg — exercises the dmg repackage
            *)       npx pylair build --bundles deb ;;
          esac

      - name: pylair build (pwsh — System32 tar ordering)
        if: ${{ runner.os == 'Windows' && matrix.build_shell == 'pwsh' }}
        working-directory: app-under-test
        shell: pwsh
        run: npx pylair build --bundles nsis

      - name: Tripwire — release exe is a GUI binary (Windows)
        if: runner.os == 'Windows'
        working-directory: app-under-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'src-tauri/target/release/app-under-test.exe'
          if (-not (Test-Path $exe)) { Write-Error "release exe not found: $exe"; exit 1 }
          # PE optional-header Subsystem: 2 = WINDOWS_GUI, 3 = CONSOLE. A
          # console-subsystem release exe pops a terminal on every launch.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe).Path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $sub = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($sub -ne 2) { Write-Error "PE subsystem $sub — expected 2 (GUI)"; exit 1 }
          Write-Output "PE subsystem = $sub (GUI)"

      - name: Self-test installed app (Linux, clean container, no Python)
        if: runner.os == 'Linux'
        working-directory: app-under-test
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          dpkg -x "$DEB" /tmp/approot
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          # Bare ubuntu:22.04 has NO python — --self-test exits before the
          # Tauri loop/GTK init but still needs its linked system libs.
          docker run --rm -e PYLAIR_WINB_CAP -v /tmp/approot:/r:ro -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" ubuntu:22.04 bash -c '
            set -e; export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3; do apt-get update -qq && break || sleep 10; done
            apt-get install -y -qq libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 ca-certificates xvfb >/dev/null
            /r/usr/bin/app-under-test --self-test
            # WindowDestroyed on the main thread — the rc.3 window-close panic.
            PYLAIR_SELF_TEST_WINDOW_CLOSE=1 timeout 90 xvfb-run -a /r/usr/bin/app-under-test
            # Two-window event-scoping test — only when the resolved crate
            # carried the selftest-winb capability (see the capability step).
            if [ "$PYLAIR_WINB_CAP" = "1" ]; then
              PYLAIR_SELF_TEST_WEBVIEW=1 timeout 120 xvfb-run -a /r/usr/bin/app-under-test
            fi
            # Lifecycle containment: clean close, SIGKILL of the host,
            # restart — the script asserts no runtime/worker survivors.
            bash /scripts/dogfood-linux.sh --exe /r/usr/bin/app-under-test'

      - name: Self-test installed app (Windows, silent NSIS install)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: app-under-test
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { Write-Error 'nsis installer not found'; exit 1 }
          $inst = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($inst.ExitCode -ne 0) { Write-Error "nsis install exit $($inst.ExitCode)"; exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
                -Recurse -Filter 'app-under-test.exe' -Depth 4 -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $exe) { Write-Error 'installed app-under-test.exe not found'; exit 1 }
          Write-Output "installed app: $($exe.FullName)"
          # GUI-subsystem exe: `&` returns immediately and $LASTEXITCODE is
          # stale — wait on the process handle and read the real ExitCode.
          $st = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -PassThru
          if (-not $st.WaitForExit(120000)) { $st.Kill(); Write-Error 'self-test timed out'; exit 1 }
          if ($st.ExitCode -ne 0) { Write-Error "self-test exit $($st.ExitCode)"; exit 1 }
          # WindowDestroyed on the main thread — the rc.3 window-close panic.
          $env:PYLAIR_SELF_TEST_WINDOW_CLOSE = '1'
          $wc = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $wc.WaitForExit(120000)) { $wc.Kill(); Write-Error 'window-close self-test timed out'; exit 1 }
          if ($wc.ExitCode -ne 0) { Write-Error "window-close self-test exit $($wc.ExitCode)"; exit 1 }
          $env:PYLAIR_SELF_TEST_WINDOW_CLOSE = $null
          # Two-window event-scoping test — only when the resolved crate
          # carried the selftest-winb capability (see the capability step).
          if ($env:PYLAIR_WINB_CAP -eq '1') {
            $env:PYLAIR_SELF_TEST_WEBVIEW = '1'
            $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $env:TEMP -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error 'webview self-test timed out'; exit 1 }
            if ($p.ExitCode -ne 0) { Write-Error "webview self-test exit $($p.ExitCode)"; exit 1 }
            $env:PYLAIR_SELF_TEST_WEBVIEW = $null
          }

      - name: Dogfood lifecycle (Windows — close, kill, restart)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
                -Recurse -Filter 'app-under-test.exe' -Depth 4 -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $exe) { Write-Error 'installed app-under-test.exe not found'; exit 1 }
          & "$env:GITHUB_WORKSPACE\scripts\dogfood-windows.ps1" `
                -ExePath $exe.FullName -InstallDir (Split-Path $exe.FullName -Parent)
          if ($LASTEXITCODE -ne 0) { Write-Error "dogfood exit $LASTEXITCODE"; exit 1 }

      - name: Self-test installed app (macOS, isolated .app, scrubbed env)
        if: runner.os == 'macOS'
        working-directory: app-under-test
        run: |
          set -e
          # Take the app from the DMG — the artifact a user downloads,
          # not the intermediate under bundle/macos. Proves the signed
          # app is what ships in the image.
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$DMG" || { echo "no .dmg under bundle/dmg"; exit 1; }
          mkdir -p dmg-mnt
          hdiutil attach -nobrowse -readonly -mountpoint dmg-mnt "$DMG"
          APP=$(find dmg-mnt -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "no .app inside the dmg"; hdiutil detach dmg-mnt -quiet; exit 1; }
          # Isolate: delete the project venv and copy the bundle out, so
          # the app cannot lean on the workspace's Python by path.
          rm -rf .venv
          ditto "$APP" ../isolated-app.app
          hdiutil detach dmg-mnt -quiet
          ISOLATED="$(cd .. && pwd)/isolated-app.app"
          PYBIN="$ISOLATED/Contents/Resources/python/bin/python3"
          test -x "$PYBIN" || { echo "bundled interpreter missing: $PYBIN"; exit 1; }
          echo "== signing status (informational — unsigned RCs expected) =="
          codesign -dv "$ISOLATED" 2>&1 || true
          codesign --verify --deep --strict "$ISOLATED" 2>&1 || true
          codesign -dv "$PYBIN" 2>&1 || true
          # /usr/bin/python3 exists on runners — a scrubbed PATH alone
          # proves nothing; the interpreter itself must report its home
          # inside THIS copy's Resources.
          EXE=$(env -i PATH=/usr/bin:/bin "$PYBIN" -c 'import sys; print(sys.executable)')
          echo "bundled sys.executable: $EXE"
          case "$EXE" in
            "$ISOLATED/Contents/Resources/"*) ;;
            *) echo "bundled interpreter reports outside Resources: $EXE"; exit 1 ;;
          esac
          echo "== --self-test: real bridge call through bundled runtime =="
          env -i PATH=/usr/bin:/bin "$ISOLATED/Contents/MacOS/$(basename "$APP" .app)" --self-test
          # WindowDestroyed on the main thread — the rc.3 window-close panic.
          env -i PATH=/usr/bin:/bin PYLAIR_SELF_TEST_WINDOW_CLOSE=1 "$ISOLATED/Contents/MacOS/$(basename "$APP" .app)"
          # Two-window event-scoping test — only when the resolved crate
          # carried the selftest-winb capability (see the capability step).
          if [ "$PYLAIR_WINB_CAP" = "1" ]; then
            env -i PATH=/usr/bin:/bin PYLAIR_SELF_TEST_WEBVIEW=1 "$ISOLATED/Contents/MacOS/$(basename "$APP" .app)"
          fi
