name: B0 spike

# Throwaway proof for docs/decisions/0010-blob-urls.md: a `pylair` custom
# URI scheme serving per-window-owned blobs with manual Range/206, probed
# from two webviews on all three webview engines. Manual-only — evidence,
# not a gate. Push trigger is scoped to the spike branch so it self-runs
# there (workflow_dispatch only lists files on the default branch).
on:
  workflow_dispatch:
  push:
    branches: [blob-spike]

permissions:
  contents: read

jobs:
  b0-spike:
    name: b0 blobs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/b0-blobs/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: spikes/b0-blobs/src-tauri
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev xvfb
      - name: Build
        run: cargo build
      - name: Run spike (Linux, xvfb)
        if: runner.os == 'Linux'
        run: PYLAIR_B0_OUT="$GITHUB_WORKSPACE/spikes/b0-blobs/out" timeout 180 xvfb-run -a ./target/debug/b0-blobs
      - name: Run spike (macOS)
        if: runner.os == 'macOS'
        # no coreutils timeout on macOS — the app self-exits after both
        # windows report; the step timeout is the backstop.
        run: PYLAIR_B0_OUT="$GITHUB_WORKSPACE/spikes/b0-blobs/out" ./target/debug/b0-blobs
      - name: Run spike (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYLAIR_B0_OUT = "$env:GITHUB_WORKSPACE\spikes\b0-blobs\out"
          New-Item -ItemType Directory -Force $env:PYLAIR_B0_OUT | Out-Null
          # Start-Process never propagates exit codes — capture -PassThru and check.
          $p = Start-Process -FilePath .\target\debug\b0-blobs.exe -PassThru -RedirectStandardError "$env:GITHUB_WORKSPACE\spikes\b0-blobs\out\stderr.log"
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error 'b0 spike timed out'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "b0 spike exit $($p.ExitCode)"; exit 1 }
      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: b0-${{ matrix.os }}
          path: spikes/b0-blobs/out/
          if-no-files-found: error
