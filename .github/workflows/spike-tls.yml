name: spike-tls-0009

# THROWAWAY spike evidence for decision 0009 (model manager): does the
# BUNDLED python-build-standalone interpreter verify HTTPS on a clean
# machine, per OS? Downloads the exact pinned artifact (PBS_TAG +
# PBS_SHA256 from packages/cli/src/build/pbs.ts) and runs positive and
# negative urllib probes. Runs only on the spike branch; not for merge.

on:
  push:
    branches: [models-0009]

permissions:
  contents: read

jobs:
  tls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch pinned PBS artifact (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)  triple=x86_64-unknown-linux-gnu; want=6a9e62dad033790aef722dbd370e0ce76ce17b73627ba3ae679f537049350b39 ;;
            macOS)  triple=aarch64-apple-darwin;     want=2f11b8aa3726bdbd87dd9eb76568412faddf4f47e26913fa45d6a2e424972acd ;;
          esac
          url="https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.12.16+20261110-${triple}-install_only_stripped.tar.gz"
          curl -fsSL "$url" -o pbs.tar.gz
          (echo "${want}  pbs.tar.gz" | sha256sum -c -) 2>/dev/null || \
            (echo "${want}  pbs.tar.gz" | shasum -a 256 -c -)
          tar -xzf pbs.tar.gz
          ./python/bin/python --version

      - name: Fetch pinned PBS artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.12.16+20261110-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
          curl -fsSL "$url" -o pbs.tar.gz
          echo "355ee61b8207b91574491b1c6dc9b0ebb4408fc56bfafe498f3ef439314b52dc  pbs.tar.gz" | sha256sum -c -
          tar -xzf pbs.tar.gz
          ./python/python.exe --version

      - name: TLS probes on the bundled interpreter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then PY=./python/python.exe; else PY=./python/bin/python; fi
          $PY -c "import os, ssl; print('SSL_CERT envs:', os.environ.get('SSL_CERT_FILE'), os.environ.get('SSL_CERT_DIR')); print('paths:', ssl.get_default_verify_paths()); ctx = ssl.create_default_context(); print('default-context CA count:', len(ctx.get_ca_certs())); [print(p, 'exists:', os.path.exists(p)) for p in ('/etc/ssl/cert.pem', '/etc/ssl/certs/ca-certificates.crt')]"

      - name: Positive probe — urllib https must verify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then PY=./python/python.exe; else PY=./python/bin/python; fi
          $PY -c "import urllib.request; r = urllib.request.urlopen('https://pypi.org/simple/', timeout=15); print('pypi.org simple ->', r.status)"

      - name: Negative probe — a bad cert must fail verification
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then PY=./python/python.exe; else PY=./python/bin/python; fi
          $PY -c "import urllib.request, urllib.error, sys; 
          try:
              urllib.request.urlopen('https://self-signed.badssl.com', timeout=15)
          except urllib.error.URLError as e:
              print('refused as expected:', e.reason); sys.exit(0)
          sys.exit('BAD: self-signed cert verified')"
