[package]
name = "inkwell"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "inkwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-pylair = "=0.1.0-rc.28"

[features]
default = []
