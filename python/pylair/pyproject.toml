[project]
name = "pylair"
version = "0.1.0-rc.9"
description = "Pylair Python runtime: @expose decorator, protocol server, task runner, cancellation, schema export"
license = "MIT OR Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylair"]

[tool.uv]
package = true

[tool.ruff]
src = ["src", "tests"]
