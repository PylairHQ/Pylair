[project]
name = "pylair"
version = "0.1.0-rc.14"
description = "Pylair Python runtime: @expose decorator, protocol server, task runner, cancellation, schema export"
license = "MIT OR Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Test-only: real frameworks for the wrap-adapter tests. Not a runtime
# dependency of pylair; the default `uv sync` stays light. Pin the
# majors the adapters support (see pylair/wrap/_gradio.py,
# pylair/wrap/_streamlit.py).
wrap = [
    "gradio>=5,<6",
    "streamlit>=1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylair"]

[tool.uv]
package = true

[tool.ruff]
src = ["src", "tests"]
