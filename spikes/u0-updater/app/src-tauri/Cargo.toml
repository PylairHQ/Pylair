[package]
name = "u0-updater-spike"
version = "0.1.0"
edition = "2021"
default-run = "u0-updater-spike"
rust-version = "1.85"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[features]
default = []
